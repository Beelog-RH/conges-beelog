// ─── Préparation Paie ─────────────────────────────────────────────────────────
function PreparationPaie({ demandes, absences, heuresSup, users, feriesAll, acquisitions, onCreditAcquisition, onAnnulerCredit }) {
  // Par défaut : dernier mois entier écoulé (le mois précédent), bascule d'année gérée
  const moisRef = (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d; })();
  const [mois, setMois] = useState(moisRef.getMonth());
  const [annee, setAnnee] = useState(moisRef.getFullYear());
  const [expanded, setExpanded] = useState({});
  const [crediting, setCrediting] = useState({});
  const salaries = users.filter(u=>u.role==="salarie");

  const fmtJ = v => {
    const n = parseFloat(v) || 0;
    return Number.isInteger(n) ? String(n) : n.toFixed(2);
  };

  // Calcule le nombre de jours ouvrés dans un mois donné (hors fériés)
  const joursOuvresMois = (year, month) => {
    let count = 0;
    const d = new Date(year, month, 1);
    while (d.getMonth() === month) {
      const day = d.getDay();
      const ds = fmtLocal(d.getFullYear(), d.getMonth()+1, d.getDate());
      if (day !== 0 && day !== 6 && !feriesAll[ds]) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  };

  // Calcule les jours ouvrés d'un congé qui tombent dans un mois/année donné
  const joursCongesDansMois = (demande, targetMois, targetAnnee, feriesMap) => {
    const debut = new Date(demande.debut);
    const fin   = new Date(demande.fin);
    // Bornes du mois cible
    const debutMois = new Date(targetAnnee, targetMois, 1);
    const finMois   = new Date(targetAnnee, targetMois + 1, 0); // dernier jour du mois
    // Intersection
    const start = debut > debutMois ? debut : debutMois;
    const end   = fin   < finMois   ? fin   : finMois;
    if (start > end) return 0;
    return joursOuvres(
      fmtLocal(start.getFullYear(), start.getMonth()+1, start.getDate()),
      fmtLocal(end.getFullYear(),   end.getMonth()+1,   end.getDate()),
      feriesMap
    );
  };

  // Jours ouvrés du mois effectivement couverts par le contrat du salarié
  // (intersection du mois avec [date d'entrée, fin de contrat])
  const joursOuvresSousContrat = (u, year, month) => {
    const mDebut = fmtLocal(year, month+1, 1);
    const mFin   = fmtLocal(year, month+1, new Date(year, month+1, 0).getDate());
    const { debut, fin } = bornesContrat(u);
    const start = (debut && debut > mDebut) ? debut : mDebut;
    const end   = (fin   && fin   < mFin)   ? fin   : mFin;
    if (start > end) return 0;
    return joursOuvres(start, end, feriesAll);
  };

  // Présence : un salarié apparaît s'il a au moins 1 jour de contrat sur le mois sélectionné.
  const recap = useMemo(() => {
    const moisDebut = `${annee}-${String(mois+1).padStart(2,"0")}-01`;
    const moisFin   = fmtLocal(annee, mois+1, new Date(annee, mois+1, 0).getDate());
    const estPresentMois = (u) => {
      const { debut, fin } = bornesContrat(u);
      if (debut && debut > moisFin)   return false;
      if (fin   && fin   < moisDebut) return false;
      return true;
    };
    return salaries.filter(estPresentMois).map(sal => {
    // Congés qui chevauchent le mois (debut <= fin du mois ET fin >= début du mois)
    const debutMois = `${annee}-${String(mois+1).padStart(2,"0")}-01`;
    const finMois   = fmtLocal(annee, mois+1, new Date(annee, mois+1, 0).getDate());

    const congesMois = demandes.filter(d =>
      d.salarieId === sal.id && d.statut === "approuve" &&
      d.debut <= finMois && d.fin >= debutMois
    );
    const absencesMois = absences.filter(a => a.salarieId === sal.id && a.mois === mois && a.annee === annee);
    const heuresMois = heuresSup.filter(h => h.salarieId === sal.id && h.mois === mois && h.annee === annee);

    // Jours réels tombant dans ce mois (gestion chevauchement)
    const joursCongesMois = congesMois.reduce((s,d) => s + joursCongesDansMois(d, mois, annee, feriesAll), 0);
    const joursCP    = congesMois.filter(d=>d.type==="Congés payés").reduce((s,d) => s + joursCongesDansMois(d, mois, annee, feriesAll), 0);
    const joursRTT   = congesMois.filter(d=>d.type==="RTT").reduce((s,d) => s + joursCongesDansMois(d, mois, annee, feriesAll), 0);
    const joursAutresConges = congesMois.filter(d=>d.type!=="Congés payés"&&d.type!=="RTT").reduce((s,d) => s + joursCongesDansMois(d, mois, annee, feriesAll), 0);

    const totalConges = joursCongesMois;
    const totalAbsences = absencesMois.reduce((s,a)=>s+a.jours, 0);
    const totalHeures = heuresMois.reduce((s,h)=>s+h.heures, 0);

    const absParType = {};
    ABSENCE_TYPES.forEach(t => {
      const n = absencesMois.filter(a=>a.type===t.id).reduce((s,a)=>s+a.jours, 0);
      if (n > 0) absParType[t.id] = n;
    });

    // ── Calcul acquisition CP ──
    // Dénominateur : le mois entier. Numérateur : les jours réellement sous contrat,
    // diminués des absences déductibles. Une entrée en cours de mois est donc proratisée.
    const joursOuvresDuMois = joursOuvresMois(annee, mois);
    const joursContrat = joursOuvresSousContrat(sal, annee, mois);
    const moisPartiel = joursContrat < joursOuvresDuMois;
    const joursDeductibles = absencesMois
      .filter(a => ABSENCE_DEDUCTIBLES_CP.includes(a.type))
      .reduce((s,a) => s+a.jours, 0);
    const joursTravailles = Math.max(0, joursContrat - joursDeductibles);
    const cpAcquis = joursOuvresDuMois > 0
      ? parseFloat((2.08 * (joursTravailles / joursOuvresDuMois)).toFixed(2))
      : 0;

    // ── Détails pour les infobulles ──
    const detailConges = congesMois.map(d => ({
      label: d.type,
      dates: `${fmtFR(d.debut)} → ${fmtFR(d.fin)}`,
      val: `${fmtJours(joursCongesDansMois(d, mois, annee, feriesAll))} j`,
      type: d.type,
    })).sort((a,b)=>a.dates.localeCompare(b.dates));

    const detailAbsences = absencesMois.map(a => ({
      label: (ABSENCE_TYPES.find(t=>t.id===a.type)||{}).label || a.type,
      dates: a.debut===a.fin ? fmtFR(a.debut) : `${fmtFR(a.debut)} → ${fmtFR(a.fin)}`,
      val: `${fmtJours(a.jours)} j`,
      type: a.type,
    })).sort((a,b)=>a.dates.localeCompare(b.dates));

    const detailHeures = heuresMois.map(h => ({
      label: h.commentaire ? h.commentaire.slice(0,28) : "Heures sup.",
      dates: `sem. du ${fmtFR(h.semaine)}`,
      val: `${fmtJours(h.heures)} h`,
    })).sort((a,b)=>a.dates.localeCompare(b.dates));

    return {
      sal, congesMois, absencesMois, heuresMois,
      totalConges, totalAbsences, totalHeures, absParType,
      joursCP, joursRTT, joursAutresConges,
      joursOuvresDuMois, joursContrat, moisPartiel,
      joursDeductibles, joursTravailles, cpAcquis,
      detailConges, detailAbsences, detailHeures,
    };
  }); }, [mois, annee, demandes, absences, heuresSup, users, feriesAll]);

  const estInterim = (r) => (r.sal.typeContrat||"cdi")==="interim";
  const recapPermanents = recap.filter(r => !estInterim(r));
  const recapInterim    = recap.filter(r => estInterim(r));

  const totals = recapPermanents.reduce((s,r) => ({
    c: s.c+r.totalConges, a: s.a+r.totalAbsences, h: s.h+r.totalHeures,
    cp: parseFloat((s.cp+r.cpAcquis).toFixed(2)),
  }), {c:0, a:0, h:0, cp:0});
  const totalsInterim = recapInterim.reduce((s,r) => ({
    a: s.a+r.totalAbsences, h: s.h+r.totalHeures,
  }), {a:0, h:0});

  const handleCSV = () => {
    const rows = [["Salarié","Contrat","Date d'entrée","Fin de contrat","CP (j)","RTT (j)","Jours ouvrés mois","Jours ouvrés sous contrat","Jours déductibles CP","Jours travaillés","CP acquis","Maladie (j)","Abs. injustifiée (j)","Acc. travail (j)","Enfant malade (j)","CSS (j)","Autre abs. NR (j)","Total absences (j)","Heures sup (h)"]];
    // Ordre : permanents puis intérimaires. Les intérimaires n'ont ni CP/RTT ni acquisition.
    [...recapPermanents, ...recapInterim].forEach(r => { const itr = estInterim(r); const bc = bornesContrat(r.sal); rows.push([
      r.sal.nom, contratLabel(r.sal.typeContrat),
      bc.debut?fmtFR(bc.debut):"", bc.fin?fmtFR(bc.fin):"",
      itr?0:r.joursCP, itr?0:r.joursRTT,
      r.joursOuvresDuMois, r.joursContrat, r.joursDeductibles, r.joursTravailles, itr?0:r.cpAcquis,
      r.absParType["maladie"]||0, r.absParType["absence_injustifiee"]||0,
      r.absParType["accident_travail"]||0, r.absParType["enfant_malade"]||0,
      r.absParType["conge_sans_solde"]||0, r.absParType["autre_absence_nr"]||0,
      r.totalAbsences, r.totalHeures,
    ]); });
    exportCSV(rows, `paie_${MONTHS[mois]}_${annee}.csv`);
  };

  // ── Rendu d'une fiche salarié (mode permanent = détail complet ; mode intérim = absences + heures sup, sans CP/RTT ni acquisition) ──
  const renderCard = (r, interim) => {
    const isOpen = expanded[r.sal.id];
    const hasData = r.totalConges>0 || r.totalAbsences>0 || r.totalHeures>0;
    const isCrediting = crediting[r.sal.id];
    const dejaCredite = (acquisitions||[]).find(a=>a.salarieId===r.sal.id && a.mois===mois && a.annee===annee);
    return <div className="sal-recap" key={r.sal.id} style={{opacity: interim ? (hasData?1:.7) : (hasData||r.cpAcquis<2.08 ? 1 : .7)}}>
      <div className="recap-header" onClick={()=>setExpanded(e=>({...e,[r.sal.id]:!e[r.sal.id]}))}>
        <div className="recap-name">{r.sal.nom}{interim&&<span className="badge" style={{color:"#6d28d9",background:"#f5f3ff",marginLeft:8,fontSize:10}}>Intérim</span>}</div>
        <div className="recap-pills">
          {r.moisPartiel&&<span className="badge" style={{color:"#6d28d9",background:"#f5f3ff"}} title="Le contrat ne couvre pas le mois entier">📆 mois partiel</span>}
          {r.totalConges>0&&<InfoTip items={r.detailConges} titre="Congés du mois">
            <span className="badge" style={{color:"var(--accent2)",background:"#d1fae5"}}>🌴 {fmtJ(r.totalConges)}j</span></InfoTip>}
          {r.totalAbsences>0&&<InfoTip items={r.detailAbsences} titre="Absences du mois">
            <span className="badge" style={{color:"var(--accent)",background:"#fee2e2"}}>🏥 {fmtJ(r.totalAbsences)}j</span></InfoTip>}
          {r.totalHeures>0&&<InfoTip items={r.detailHeures} titre="Heures supplémentaires">
            <span className="badge" style={{color:"#2563eb",background:"#dbeafe"}}>⏱ {fmtJ(r.totalHeures)}h</span></InfoTip>}
          {!interim&&<span className="badge" style={{color:"#d97706",background:"#fef3c7"}}>📈 +{fmtJ(r.cpAcquis)} CP</span>}
          {!interim&&!hasData&&r.cpAcquis===2.08&&<span style={{fontSize:11,color:"var(--muted)"}}>Mois complet</span>}
          {interim&&!hasData&&<span style={{fontSize:11,color:"var(--muted)"}}>Aucun mouvement</span>}
          <span style={{color:"var(--muted)",fontSize:15}}>{isOpen?"▲":"▼"}</span>
        </div>
      </div>
      {isOpen && <div className="recap-body" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        {!interim&&<>
          <div><div className="recap-item-label">Congés payés posés</div>
            <InfoTip items={r.detailConges.filter(x=>x.type==="Congés payés")} titre="Congés payés">
              <div className="recap-item-val" style={{color:"var(--accent2)"}}>{fmtJ(r.joursCP)}j</div></InfoTip></div>
          <div><div className="recap-item-label">RTT</div>
            <InfoTip items={r.detailConges.filter(x=>x.type==="RTT")} titre="RTT">
              <div className="recap-item-val" style={{color:"#7c3aed"}}>{fmtJ(r.joursRTT)}j</div></InfoTip></div>
        </>}
        <div><div className="recap-item-label">Heures sup.</div>
          <InfoTip items={r.detailHeures} titre="Heures supplémentaires">
            <div className="recap-item-val" style={{color:"#2563eb"}}>{fmtJ(r.totalHeures)}h</div></InfoTip></div>
        {ABSENCE_TYPES.map(t => { const jrs = r.absParType[t.id]||0; return (
          <div key={t.id}><div className="recap-item-label">{t.icon} {t.label}{t.deductibleCP?<span style={{fontSize:9,color:"#d97706",marginLeft:3}}>−CP</span>:""}</div>
            <InfoTip items={r.detailAbsences.filter(x=>x.type===t.id)} titre={t.label}>
              <div className="recap-item-val" style={{color:jrs>0?t.color:"var(--muted)"}}>{fmtJ(jrs)}j</div></InfoTip></div>
        ); })}

        {!interim&&<div style={{gridColumn:"1/-1",marginTop:12,paddingTop:12,borderTop:"1px solid var(--border)"}}>
          <div style={{display:"grid",gridTemplateColumns:`repeat(${r.moisPartiel?5:4},1fr)`,gap:10,marginBottom:12}}>
            <div style={{background:"#f8f7f4",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Jours ouvrés du mois</div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22}}>{r.joursOuvresDuMois}</div>
            </div>
            {r.moisPartiel&&<div style={{background:"#f5f3ff",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Jours sous contrat</div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#6d28d9"}}>{r.joursContrat}</div>
              <div style={{fontSize:9,color:"var(--muted)",marginTop:2}}>
                {(()=>{const b=bornesContrat(r.sal);return `${b.debut?fmtFR(b.debut):"—"}${b.fin?` → ${fmtFR(b.fin)}`:""}`;})()}
              </div>
            </div>}
            <div style={{background:"#fff8f0",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Jours déductibles</div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#c84b31"}}>{r.joursDeductibles}</div>
            </div>
            <div style={{background:"#eef6f2",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Jours travaillés</div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"var(--accent2)"}}>{r.joursTravailles}</div>
            </div>
            <div style={{background:"#fef9ec",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>CP acquis ce mois</div>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#d97706"}}>+{fmtJ(r.cpAcquis)}</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
            <div style={{fontSize:12,color:"var(--muted)"}}>
              Solde actuel : <strong style={{color:"var(--ink)"}}>{fmtJ(r.sal.solde)} j CP disponibles</strong> · <strong style={{color:"#d97706"}}>{fmtJ(r.sal.soldeAcquisition||0)} j en acquisition</strong>
            </div>
            <button
              className="btn btn-orange btn-sm"
              disabled={isCrediting || r.cpAcquis <= 0}
              onClick={async e => {
                e.stopPropagation();
                setCrediting(c=>({...c,[r.sal.id]:true}));
                await onCreditAcquisition(r.sal.id, r.cpAcquis, mois, annee);
                setCrediting(c=>({...c,[r.sal.id]:false}));
              }}
              style={dejaCredite?{display:"none"}:undefined}
            >
              {isCrediting ? "Crédit en cours…" : `📈 Créditer +${fmtJ(r.cpAcquis)} j en acquisition`}
            </button>
            {dejaCredite && (
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <span className="badge" style={{color:"#065f46",background:"#d1fae5"}}>
                  ✓ Crédité (+{fmtJ(dejaCredite.montant)} j){dejaCredite.dateCredit?` le ${new Date(dejaCredite.dateCredit).toLocaleDateString("fr-FR")}`:""}
                </span>
                <button
                  className="btn btn-ghost btn-sm"
                  disabled={isCrediting}
                  onClick={async e => {
                    e.stopPropagation();
                    setCrediting(c=>({...c,[r.sal.id]:true}));
                    await onAnnulerCredit(r.sal.id, mois, annee);
                    setCrediting(c=>({...c,[r.sal.id]:false}));
                  }}
                >
                  {isCrediting ? "…" : "↩ Annuler le crédit"}
                </button>
              </div>
            )}
          </div>
        </div>}
      </div>}
    </div>;
  };

  return <>
    <div className="page-header">
      <div><div className="page-title">Préparation paie 💶</div><div className="page-sub">Récapitulatif mensuel — {MONTHS[mois]} {annee}</div></div>
      <div className="actions-row">
        <div className="month-selector">
          <select value={mois} onChange={e=>setMois(parseInt(e.target.value))}>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
          <select value={annee} onChange={e=>setAnnee(parseInt(e.target.value))}>{[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}</select>
        </div>
        <button className="btn btn-blue" onClick={handleCSV}>⬇ Export CSV</button>
      </div>
    </div>
    <div className="page-body">
      <div className="page-title" style={{fontSize:20,marginBottom:12}}>Effectif permanent (CDI · CDD)</div>
      <div className="paie-grid">
        <div className="paie-stat"><div className="paie-stat-val" style={{color:"var(--accent2)"}}>{totals.c}</div><div className="paie-stat-lbl">Jours congés posés</div></div>
        <div className="paie-stat"><div className="paie-stat-val" style={{color:"var(--accent)"}}>{totals.a}</div><div className="paie-stat-lbl">Jours d'absence</div></div>
        <div className="paie-stat"><div className="paie-stat-val" style={{color:"#2563eb"}}>{totals.h}h</div><div className="paie-stat-lbl">Heures supplémentaires</div></div>
        <div className="paie-stat"><div className="paie-stat-val" style={{color:"#d97706"}}>{fmtJ(totals.cp)}</div><div className="paie-stat-lbl">CP acquis ce mois (total équipe)</div></div>
      </div>

      <div className="info-box info-blue" style={{marginBottom:16}}>
        📌 <strong>Règle d'acquisition :</strong> 2,08 j/mois × (jours travaillés ÷ jours ouvrés du mois entier). Les jours travaillés sont les jours ouvrés <strong>couverts par le contrat</strong>, diminués des absences déductibles — une entrée ou une sortie en cours de mois est donc proratisée. Déductibles : absence injustifiée, congé sans solde, autre absence non rémunérée. Non déductibles : maladie, enfant malade, accident travail, CP posés.
      </div>

      {recapPermanents.length===0
        ? <div className="empty-state"><div className="empty-icon">👥</div><p>Aucun salarié permanent présent sur ce mois.</p></div>
        : recapPermanents.map(r => renderCard(r, false))}

      {recapInterim.length>0 && <>
        <div style={{margin:"30px 0 12px",display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap"}}>
          <div className="page-title" style={{fontSize:20}}>Intérimaires 🕒</div>
          <span style={{fontSize:12,color:"var(--muted)"}}>{recapInterim.length} présent(s) ce mois · absences et heures sup. uniquement (pas de CP/RTT)</span>
        </div>
        <div className="paie-grid" style={{gridTemplateColumns:"repeat(2,1fr)"}}>
          <div className="paie-stat"><div className="paie-stat-val" style={{color:"var(--accent)"}}>{totalsInterim.a}</div><div className="paie-stat-lbl">Jours d'absence (intérim)</div></div>
          <div className="paie-stat"><div className="paie-stat-val" style={{color:"#2563eb"}}>{totalsInterim.h}h</div><div className="paie-stat-lbl">Heures supplémentaires (intérim)</div></div>
        </div>
        {recapInterim.map(r => renderCard(r, true))}
      </>}
    </div>
  </>;
}

// ─── Équipe ───────────────────────────────────────────────────────────────────
function Equipe({ users, demandes, absences }) {
  const salaries = users.filter(u=>u.role==="salarie");
  const managers = users.filter(u=>u.role==="manager");
  const fmtJ = v => { const n = parseFloat(v)||0; return Number.isInteger(n) ? String(n) : n.toFixed(2); };
  return <>
    <div className="page-header"><div><div className="page-title">Mon équipe</div><div className="page-sub">Soldes et situation</div></div></div>
    <div className="page-body">
      <div className="table-wrap"><table>
        <thead><tr><th>Salarié</th><th>Manager</th><th>CP disponibles</th><th>CP en acquisition</th><th>RTT</th><th>Absences</th><th>En attente</th></tr></thead>
        <tbody>{salaries.map(s=>{
          const mgr=managers.find(m=>m.id===s.managerId);
          return <tr key={s.id}>
            <td><strong>{s.nom}</strong><br/><span style={{fontSize:11,color:"var(--muted)"}}>{s.email}</span></td>
            <td style={{fontSize:12}}>{mgr?mgr.nom:<span style={{color:"var(--muted)"}}>—</span>}</td>
            <td><span style={{fontFamily:"'DM Serif Display',serif",fontSize:19,color:"var(--accent2)"}}>{fmtJ(s.solde)}</span> <span style={{fontSize:11,color:"var(--muted)"}}>j</span></td>
            <td><span style={{fontFamily:"'DM Serif Display',serif",fontSize:19,color:"#d97706"}}>{fmtJ(s.soldeAcquisition||0)}</span> <span style={{fontSize:11,color:"var(--muted)"}}>j</span></td>
            <td><span style={{fontFamily:"'DM Serif Display',serif",fontSize:19,color:"#7c3aed"}}>{fmtJ(s.soldeRTT)}</span> <span style={{fontSize:11,color:"var(--muted)"}}>j</span></td>
            <td>{absences.filter(a=>a.salarieId===s.id).reduce((s,a)=>s+a.jours,0)}j</td>
            <td>{demandes.filter(d=>d.salarieId===s.id&&d.statut==="en_attente").length}</td>
          </tr>;
        })}</tbody>
      </table></div>
    </div>
  </>;
}

// ─── Gestion Employés ─────────────────────────────────────────────────────────
function GestionEmployes({ users, onAdd, onDelete, onUpdate }) {
  const [modal, setModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [form, setForm] = useState({nom:"",email:"",password:"",role:"salarie",isAdmin:false,managerId:"",pole:"production",typeContrat:"cdi",contratDebut:"",contratFin:"",solde:0,soldeRTT:0,soldeAcquisition:0});
  const [formErr, setFormErr] = useState("");
  const [presentsOnly, setPresentsOnly] = useState(true);
  const [recherche, setRecherche] = useState("");
  const managers = users.filter(u=>u.role==="manager");
  const adminManagers = users.filter(u=>u.isAdmin&&u.role==="manager");

  const q = norm(recherche);
  const visibles = users.filter(u =>
    (!presentsOnly || estPresent(u)) && (!q || norm(u.nom).includes(q))
  );

  const openAdd = () => { setForm({nom:"",email:"",password:"",role:"salarie",isAdmin:false,managerId:managers[0]?.id||"",pole:"production",typeContrat:"cdi",contratDebut:"",contratFin:"",solde:0,soldeRTT:0,soldeAcquisition:0}); setFormErr(""); setModal("add"); };
  const openEdit = (u) => { setForm({nom:u.nom,email:u.email,password:"",role:u.role,isAdmin:u.isAdmin,managerId:u.managerId||"",pole:u.pole||"production",typeContrat:u.typeContrat||"cdi",contratDebut:u.contratDebut||"",contratFin:u.contratFin||"",solde:u.solde,soldeRTT:u.soldeRTT,soldeAcquisition:u.soldeAcquisition||0}); setFormErr(""); setModal(u); };

  // Vérifie qu'il restera au moins un admin manager après suppression/modification
  const wouldRemoveLastAdmin = (userId, changes={}) => {
    const futureUsers = users.map(u=>u.id===userId?{...u,...changes}:u);
    return !futureUsers.some(u=>u.isAdmin&&u.role==="manager");
  };

  const submitAdd = () => {
    if (!form.nom.trim()||!form.email.trim()||!form.password.trim()) return setFormErr("Nom, email et mot de passe requis.");
    if (users.find(u=>u.email===form.email.trim())) return setFormErr("Email déjà utilisé.");
    if (form.password.length<4) return setFormErr("Mot de passe trop court (min 4 caractères).");
    if (form.isAdmin && form.role!=="manager") return setFormErr("Un administrateur doit obligatoirement être manager.");
    if (form.typeContrat!=="cdi" && (!form.contratDebut||!form.contratFin)) return setFormErr("Pour un CDD/intérim, les dates de début et de fin de contrat sont obligatoires.");
    if (form.typeContrat!=="cdi" && form.contratFin < form.contratDebut) return setFormErr("La date de fin de contrat ne peut pas précéder la date de début.");
    const estInterim = form.typeContrat==="interim";
    onAdd({...form,nom:form.nom.trim(),email:form.email.trim(),managerId:form.role==="salarie"?parseInt(form.managerId)||null:null,pole:form.pole,typeContrat:form.typeContrat,contratDebut:form.contratDebut||null,contratFin:form.typeContrat==="cdi"?null:form.contratFin,solde:estInterim?0:num(form.solde,0),soldeRTT:estInterim?0:num(form.soldeRTT,0),soldeAcquisition:estInterim?0:num(form.soldeAcquisition,0),mustChangePassword:true});
    setModal(null);
  };

  const submitEdit = () => {
    if (!form.nom.trim()||!form.email.trim()) return setFormErr("Nom et email requis.");
    if (users.find(u=>u.email===form.email.trim()&&u.id!==modal.id)) return setFormErr("Email déjà utilisé.");
    if (form.isAdmin && form.role!=="manager") return setFormErr("Un administrateur doit être manager.");
    if (form.typeContrat!=="cdi" && (!form.contratDebut||!form.contratFin)) return setFormErr("Pour un CDD/intérim, les dates de début et de fin de contrat sont obligatoires.");
    if (form.typeContrat!=="cdi" && form.contratFin < form.contratDebut) return setFormErr("La date de fin de contrat ne peut pas précéder la date de début.");
    const estInterim = form.typeContrat==="interim";
    const changes={nom:form.nom.trim(),email:form.email.trim(),role:form.role,isAdmin:form.isAdmin,managerId:form.role==="salarie"?parseInt(form.managerId)||null:null,pole:form.pole,typeContrat:form.typeContrat,contratDebut:form.contratDebut||null,contratFin:form.typeContrat==="cdi"?null:form.contratFin};
    // Un intérimaire n'a pas de CP/RTT : on masque les champs et on ne modifie pas ces valeurs sur une fiche existante.
    if (!estInterim) { changes.solde=num(form.solde,0); changes.soldeRTT=num(form.soldeRTT,0); changes.soldeAcquisition=num(form.soldeAcquisition,0); }
    if (form.password.trim()) changes.password=form.password.trim();
    // Vérifier qu'on ne retire pas le dernier admin
    if (modal.isAdmin && !form.isAdmin && wouldRemoveLastAdmin(modal.id,changes)) return setFormErr("Impossible : il doit toujours rester au moins un administrateur manager.");
    onUpdate(modal.id,changes);
    setModal(null);
  };

  const getRolePill = (u) => {
    if (u.isAdmin) return <span className="pill-admin">🛡️ Admin</span>;
    if (u.role==="manager") return <span className="pill-manager">👑 Manager</span>;
    return <span className="pill-salarie">Salarié</span>;
  };

  return <>
    <div className="page-header">
      <div><div className="page-title">Gestion employés ⚙️</div><div className="page-sub">{visibles.length} compte(s) affiché(s) sur {users.length} · {adminManagers.length} admin(s)</div></div>
      <button className="btn btn-primary" onClick={openAdd}>+ Nouvel employé</button>
    </div>
    <div className="page-body">
      <div className="filter-bar">
        <label className="sel-sal-check" title="N'afficher que les comptes dont le contrat est en cours aujourd'hui">
          <input type="checkbox" checked={presentsOnly} onChange={e=>setPresentsOnly(e.target.checked)} />
          Présents uniquement
        </label>
        <input className="filter-search" placeholder="Rechercher un nom…" value={recherche} onChange={e=>setRecherche(e.target.value)} />
        {(recherche||!presentsOnly)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setRecherche("");setPresentsOnly(true);}}>✕ Réinitialiser</button>}
      </div>
      {visibles.length===0
        ? <div className="empty-state"><div className="empty-icon">🔍</div><p>Aucun compte ne correspond{presentsOnly?" parmi les salariés présents":""}.</p></div>
        : <div className="table-wrap"><table>
        <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Pôle</th><th>Contrat</th><th>Manager rattaché</th><th>CP dispo</th><th>CP acq.</th><th>RTT</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>{visibles.map(u=>{
          const mgr=managers.find(m=>m.id===u.managerId);
          const isProtected=u.isAdmin;
          const fmtJ = v => { const n=parseFloat(v)||0; return Number.isInteger(n)?String(n):n.toFixed(2); };
          return <tr key={u.id}>
            <td><strong>{u.nom}</strong>{u.isAdmin&&<span style={{fontSize:10,color:"#7c3aed",marginLeft:5}}>🛡️</span>}</td>
            <td style={{fontSize:11,color:"var(--muted)"}}>{u.email}</td>
            <td>{getRolePill(u)}</td>
            <td style={{fontSize:11}}>{poleLabel(u.pole)}</td>
            <td style={{fontSize:11}}>
              {(u.typeContrat||"cdi")==="cdi"
                ? <span>CDI{u.contratDebut&&<><br/><span style={{color:"var(--muted)",fontSize:10}}>depuis le {fmtFR(u.contratDebut)}</span></>}</span>
                : <span>{contratLabel(u.typeContrat)}<br/><span style={{color:"var(--muted)",fontSize:10}}>{fmtFR(u.contratDebut)} → {fmtFR(u.contratFin)}</span></span>}
            </td>
            <td style={{fontSize:11}}>{mgr?mgr.nom:<span style={{color:"var(--muted)"}}>—</span>}</td>
            <td>{fmtJ(u.solde)}j</td><td style={{color:"#d97706"}}>{fmtJ(u.soldeAcquisition||0)}j</td><td>{fmtJ(u.soldeRTT)}j</td>
            <td>{u.mustChangePassword?<span className="badge" style={{color:"#d97706",background:"#fef3c7"}}>⚠ Temporaire</span>:<span className="badge" style={{color:"var(--accent2)",background:"#d1fae5"}}>✓ Actif</span>}</td>
            <td><div className="actions-row">
              <button className="btn btn-orange btn-sm" onClick={()=>openEdit(u)}>✏ Modifier</button>
              {!isProtected
                ? <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel(u)}>🗑 Suppr.</button>
                : <span className="badge" style={{color:"#7c3aed",background:"#f5f3ff",fontSize:10}}>🔒 Protégé</span>
              }
            </div></td>
          </tr>;
        })}</tbody>
      </table></div>}
      <div className="info-box info-purple" style={{marginTop:12}}>🛡️ Les comptes administrateurs ne peuvent pas être supprimés. Il doit toujours exister au moins un administrateur manager.</div>
    </div>

    {modal&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
      <div className="modal">
        <div className="modal-header">
          <div className="modal-title">{modal==="add"?"Nouvel employé":"Modifier l'employé"}</div>
          <button className="modal-close" onClick={()=>setModal(null)}>×</button>
        </div>
        {formErr&&<div className="info-box info-warn" style={{marginBottom:12}}>{formErr}</div>}
        <div className="form-grid">
          <div className="form-group"><label>Nom complet</label><input type="text" value={form.nom} onChange={e=>setForm({...form,nom:e.target.value})} placeholder="Prénom Nom" /></div>
          <div className="form-group"><label>Email</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></div>
          <div className="form-group"><label>{modal==="add"?"Mot de passe initial":"Nouveau MDP (vide = inchangé)"}</label>
            <input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder={modal==="add"?"Temporaire…":"Laisser vide pour ne pas changer"} /></div>
          <div className="form-group"><label>Rôle</label>
            <select value={form.role} onChange={e=>setForm({...form,role:e.target.value,isAdmin:e.target.value==="salarie"?false:form.isAdmin})}>
              <option value="salarie">Salarié</option>
              <option value="manager">Manager</option>
            </select></div>
          <div className="form-group"><label>Pôle</label>
            <select value={form.pole} onChange={e=>setForm({...form,pole:e.target.value})}>
              {POLES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
            </select></div>
          <div className="form-group"><label>Type de contrat</label>
            <select value={form.typeContrat} onChange={e=>setForm({...form,typeContrat:e.target.value})}>
              {CONTRATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
            </select></div>
          <div className="form-group"><label>Date d'entrée{form.typeContrat==="cdi"?" (facultative)":""}</label>
            <input type="date" value={form.contratDebut} onChange={e=>setForm({...form,contratDebut:e.target.value})} /></div>
          {form.typeContrat!=="cdi" && (
            <div className="form-group"><label>Fin de contrat</label>
              <input type="date" value={form.contratFin} min={form.contratDebut} onChange={e=>setForm({...form,contratFin:e.target.value})} /></div>
          )}
          <div className="form-group full"><div className="info-box info-blue" style={{margin:0,fontSize:12.5}}>
            ℹ La date d'entrée sert au calcul proratisé des CP acquis le mois de l'arrivée et interdit toute saisie de congé ou d'absence antérieure. La renseigner pour un CDI est recommandé, mais reste facultatif.
          </div></div>
          {form.role==="manager"&&(
            <div className="form-group full">
              <label className="checkbox-row">
                <input type="checkbox" checked={form.isAdmin} onChange={e=>setForm({...form,isAdmin:e.target.checked})} />
                Accorder les droits Administrateur à ce manager
              </label>
              {form.isAdmin&&<div className="info-box info-purple" style={{marginTop:6}}>🛡️ L'admin peut gérer tous les employés, les jours fériés et ne peut pas être supprimé.</div>}
            </div>
          )}
          {form.role==="salarie"&&(
            <div className="form-group"><label>Manager rattaché</label>
              <select value={form.managerId} onChange={e=>setForm({...form,managerId:e.target.value})}>
                <option value="">— Aucun —</option>
                {managers.map(m=><option key={m.id} value={m.id}>{m.nom}</option>)}
              </select></div>
          )}
          {form.typeContrat==="interim"
            ? <div className="form-group full"><div className="info-box info-purple" style={{margin:0}}>🕒 Un intérimaire ne dispose pas de compteurs de congés : les CP, CP en acquisition et RTT ne sont pas gérés pour ce contrat.</div></div>
            : <>
              <div className="form-group"><label>Solde CP disponibles (j)</label><input type="number" step="0.01" min="0" max="999" value={form.solde} onChange={e=>setForm({...form,solde:e.target.value})} /></div>
              <div className="form-group"><label>CP en acquisition (j)</label><input type="number" step="0.01" min="0" max="999" value={form.soldeAcquisition} onChange={e=>setForm({...form,soldeAcquisition:e.target.value})} /></div>
              <div className="form-group"><label>Solde RTT (jours)</label><input type="number" step="0.5" min="0" max="99" value={form.soldeRTT} onChange={e=>setForm({...form,soldeRTT:e.target.value})} /></div>
            </>}
        </div>
        {modal==="add"&&<div className="info-box info-blue" style={{marginTop:10}}>ℹ L'employé devra changer son mot de passe à la 1ère connexion.</div>}
        <div className="form-actions">
          <button className="btn btn-primary" onClick={modal==="add"?submitAdd:submitEdit}>{modal==="add"?"Créer le compte":"Enregistrer"}</button>
          <button className="btn btn-ghost" onClick={()=>setModal(null)}>Annuler</button>
        </div>
      </div>
    </div>}

    {confirmDel&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setConfirmDel(null)}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="modal-header"><div className="modal-title">Supprimer un employé</div><button className="modal-close" onClick={()=>setConfirmDel(null)}>×</button></div>
        <p style={{fontSize:13.5,color:"var(--muted)",marginBottom:14}}>Confirmer la suppression de <strong style={{color:"var(--ink)"}}>{confirmDel.nom}</strong> ? Action irréversible.</p>
        <div className="form-actions">
          <button className="btn btn-danger" onClick={()=>{onDelete(confirmDel.id);setConfirmDel(null);}}>Supprimer définitivement</button>
          <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Annuler</button>
        </div>
      </div>
    </div>}
  </>;
}

const SUPABASE_URL = "https://dqeyagmsoczdgwlbxhgg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_BstRyMNgdlj4Y9xBH-2BTw_yGxDrBgN";

// Client Supabase léger (sans SDK, appels REST directs)
const sb = {
  headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
  url: SUPABASE_URL,

  async select(table, params="") {
    const r = await fetch(`${this.url}/rest/v1/${table}?${params}`, { headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async insert(table, data) {
    const r = await fetch(`${this.url}/rest/v1/${table}`, { method:"POST", headers: this.headers, body: JSON.stringify(data) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async update(table, id, data) {
    const r = await fetch(`${this.url}/rest/v1/${table}?id=eq.${id}`, { method:"PATCH", headers: this.headers, body: JSON.stringify(data) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async delete(table, id) {
    const r = await fetch(`${this.url}/rest/v1/${table}?id=eq.${id}`, { method:"DELETE", headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async rpc(fn, params) {
    const r = await fetch(`${this.url}/rest/v1/rpc/${fn}`, { method:"POST", headers: this.headers, body: JSON.stringify(params) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
};

// ─── Helpers Supabase ─────────────────────────────────────────────────────────
const toUser = r => ({
  id: r.id, email: r.email, nom: r.nom, role: r.role,
  isAdmin: r.is_admin, managerId: r.manager_id,
  pole: r.pole || "production",
  typeContrat: r.type_contrat || "cdi",
  contratDebut: r.contrat_debut || null,
  contratFin: r.contrat_fin || null,
  solde: r.solde != null ? parseFloat(r.solde) : 0,
  soldeRTT: r.solde_rtt != null ? parseFloat(r.solde_rtt) : 0,
  soldeAcquisition: r.solde_acquisition != null ? parseFloat(r.solde_acquisition) : 0,
  mustChangePassword: r.must_change_password,
});

const toDemande = r => ({
  id: r.id, salarieId: r.salarie_id, salarie: r.salarie_nom,
  debut: r.debut, fin: r.fin, jours: r.jours==null?0:Number(r.jours), type: r.type,
  statut: r.statut, motif: r.motif || "", date_demande: r.date_demande,
  saisiParManager: r.saisi_par_manager || false,
  demiDebut: r.demi_debut || null, demiFin: r.demi_fin || null,
});

const toAbsence = r => ({
  id: r.id, salarieId: r.salarie_id, salarie: r.salarie_nom,
  type: r.type, debut: r.debut, fin: r.fin, jours: r.jours==null?0:Number(r.jours),
  commentaire: r.commentaire || "", mois: r.mois, annee: r.annee,
  demiDebut: r.demi_debut || null, demiFin: r.demi_fin || null,
});

const toHeureSup = r => ({
  id: r.id, salarieId: r.salarie_id, salarie: r.salarie_nom,
  heures: r.heures, semaine: r.semaine, commentaire: r.commentaire || "",
  mois: r.mois, annee: r.annee,
});

const toAcquisition = r => ({
  id: r.id, salarieId: r.salarie_id, mois: r.mois, annee: r.annee,
  montant: r.montant != null ? parseFloat(r.montant) : 0,
  dateCredit: r.date_credit,
});

// ─── Root avec Supabase ────────────────────────────────────────────────────────
function App() {
  const [users, setUsers] = useState([]);
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [demandes, setDemandes] = useState([]);
  const [absences, setAbsences] = useState([]);
  const [heuresSup, setHeuresSup] = useState([]);
  const [acquisitions, setAcquisitions] = useState([]);
  const [feriesManuels, setFeriesManuels] = useState({});
  const [feriesOverrides, setFeriesOverrides] = useState({});
  const [feriesSupprimés, setFeriesSupprimés] = useState([]); // ["2026-05-01", ...]
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(false);
  const [dbError, setDbError] = useState(null);

  const toast$ = (msg, type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null), 3400); };
  const errToast = msg => toast$(msg, "err");

  // Chargement initial de toutes les données
  const loadAll = async () => {
    setLoading(true);
    try {
      const [us, dem, abs, hsup, ferM, ferO, ferS, acq] = await Promise.all([
        sb.select("employes", "order=nom.asc"),
        sb.select("demandes", "order=date_demande.desc"),
        sb.select("absences", "order=debut.desc"),
        sb.select("heures_sup", "order=semaine.desc"),
        sb.select("feries_manuels"),
        sb.select("feries_overrides"),
        sb.select("feries_supprimes"),
        sb.select("acquisitions_creditees"),
      ]);
      setUsers(us.map(toUser));
      setDemandes(dem.map(toDemande));
      setAbsences(abs.map(toAbsence));
      setHeuresSup(hsup.map(toHeureSup));
      setAcquisitions(acq.map(toAcquisition));
      const fm = {}; ferM.forEach(r => { fm[r.date] = r.label; }); setFeriesManuels(fm);
      const fo = {}; ferO.forEach(r => { fo[r.orig_date] = { newDate: r.new_date }; }); setFeriesOverrides(fo);
      setFeriesSupprimés(ferS.map(r => r.date));
    } catch(e) {
      setDbError("Impossible de contacter la base de données. Vérifiez vos clés Supabase.");
    }
    setLoading(false);
  };

  React.useEffect(() => { loadAll(); }, []);

  const feriesAll = useMemo(() => {
    const years = [-1,0,1,2].map(d=>new Date().getFullYear()+d);
    const result = {};
    years.forEach(y => {
      const base = getFeriesAuto(y);
      Object.entries(base).forEach(([origDate,label]) => {
        if (feriesSupprimés.includes(origDate)) return; // exclu
        const ov = feriesOverrides[origDate];
        result[ov ? ov.newDate : origDate] = label;
      });
    });
    Object.entries(feriesManuels).forEach(([d,label]) => { result[d] = label; });
    return result;
  }, [feriesManuels, feriesOverrides, feriesSupprimés]);

  // ── Auth ──
 const handleLogin = async (emailSaisi, pwdSaisi) => {
    try {
      const res = await sb.rpc("verify_password", { p_email: emailSaisi, p_password: pwdSaisi });
      if (!res || !res[0] || !res[0].id) return "Email ou mot de passe incorrect.";
      const u = users.find(u => u.id === res[0].id);
      if (u) {
        // Utiliser must_change_password depuis la base, pas depuis le state local
        setUser({...u, mustChangePassword: res[0].must_change_password});
        setPage("dashboard");
        return null;
      }
      return "Utilisateur introuvable.";
    } catch(e) {
      return "Erreur de connexion : " + e.message;
    }
  };

  const handleChangePwd = async (pwd) => {
    try {
      await sb.rpc("change_password", { p_user_id: user.id, p_new_password: pwd });
      setUser(u=>({...u,mustChangePassword:false}));
      toast$("✅ Mot de passe mis à jour !");
    } catch(e) {
      // Ignorer l'erreur de parsing si la fonction répond vide
      setUser(u=>({...u,mustChangePassword:false}));
      toast$("✅ Mot de passe mis à jour !");
    }
  };

  // ── Demandes ──
  const handleNouvelleDemande = async (d) => {
    try {
      const [r] = await sb.insert("demandes", {
        salarie_id: d.salarieId, salarie_nom: d.salarie,
        debut: d.debut, fin: d.fin, jours: d.jours, type: d.type,
        statut: "en_attente", motif: d.motif,
        date_demande: new Date().toISOString().split("T")[0],
        demi_debut: d.demiDebut || null, demi_fin: d.demiFin || null,
      });
      setDemandes(p=>[toDemande(r),...p]);
      toast$("✅ Demande envoyée !"); setPage("historique");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleEditDemande = async (id, c) => {
    try {
      const payload = {};
      if (c.debut) payload.debut = c.debut;
      if (c.fin) payload.fin = c.fin;
      if (c.jours != null) payload.jours = c.jours;
      if (c.type) payload.type = c.type;
      if (c.motif !== undefined) payload.motif = c.motif;
      if ("demiDebut" in c) payload.demi_debut = c.demiDebut || null;
      if ("demiFin" in c) payload.demi_fin = c.demiFin || null;
      await sb.update("demandes", id, payload);
      setDemandes(p=>p.map(d=>d.id===id?{...d,...c}:d));
      toast$("✅ Demande modifiée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteDemande = async (id) => {
    try {
      await sb.delete("demandes", id);
      setDemandes(p=>p.filter(d=>d.id!==id));
      toast$("🗑 Demande supprimée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleValider = async (id) => {
    try {
      const d = demandes.find(x=>x.id===id); if(!d) return;
      const sal = users.find(u=>u.id===d.salarieId); if(!sal) return;
      const field = d.type==="RTT" ? "solde_rtt" : "solde";
      const newSolde = (d.type==="RTT" ? sal.soldeRTT : sal.solde) - d.jours;
      await sb.update("demandes", id, { statut: "approuve" });
      await sb.update("employes", sal.id, { [field]: newSolde });
      setDemandes(p=>p.map(x=>x.id===id?{...x,statut:"approuve"}:x));
      setUsers(p=>p.map(u=>u.id===sal.id?{...u,[d.type==="RTT"?"soldeRTT":"solde"]:newSolde}:u));
      if (user && user.id===sal.id) setUser(u=>({...u,[d.type==="RTT"?"soldeRTT":"solde"]:newSolde}));
      toast$("✅ Congé approuvé");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleRefuser = async (id) => {
    try {
      await sb.update("demandes", id, { statut: "refuse" });
      setDemandes(p=>p.map(d=>d.id===id?{...d,statut:"refuse"}:d));
      toast$("✗ Congé refusé");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleAnnuler = async (id) => {
    try {
      const d = demandes.find(x=>x.id===id); if(!d) return;
      const sal = users.find(u=>u.id===d.salarieId); if(!sal) return;
      const field = d.type==="RTT" ? "solde_rtt" : "solde";
      const newSolde = (d.type==="RTT" ? sal.soldeRTT : sal.solde) + d.jours;
      await sb.update("demandes", id, { statut: "annule" });
      await sb.update("employes", sal.id, { [field]: newSolde });
      setDemandes(p=>p.map(x=>x.id===id?{...x,statut:"annule"}:x));
      setUsers(p=>p.map(u=>u.id===sal.id?{...u,[d.type==="RTT"?"soldeRTT":"solde"]:newSolde}:u));
      if (user && user.id===sal.id) setUser(u=>({...u,[d.type==="RTT"?"soldeRTT":"solde"]:newSolde}));
      toast$(`↩ Annulé — ${fmtJours(d.jours)}j recrédités à ${d.salarie}`);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleSaisirPourSalarie = async (d) => {
    try {
      const [r] = await sb.insert("demandes", {
        salarie_id: d.salarieId, salarie_nom: d.salarie,
        debut: d.debut, fin: d.fin, jours: d.jours, type: d.type,
        statut: "en_attente", motif: d.motif || "",
        date_demande: new Date().toISOString().split("T")[0],
        saisi_par_manager: true,
        demi_debut: d.demiDebut || null, demi_fin: d.demiFin || null,
      });
      setDemandes(p=>[toDemande(r),...p]);
      toast$(`📋 Demande créée pour ${d.salarie}`);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // Modification administrateur d'un congé.
  // Si le congé est déjà approuvé, le solde a été débité : l'écart de durée
  // (ou le changement de compteur CP ↔ RTT) est réajusté automatiquement.
  const handleEditDemandeAdmin = async (id, c) => {
    try {
      const d = demandes.find(x=>x.id===id); if(!d) return;
      const sal = users.find(u=>u.id===d.salarieId);

      await sb.update("demandes", id, {
        debut: c.debut, fin: c.fin, jours: c.jours, type: c.type,
        motif: c.motif || "",
        demi_debut: c.demiDebut || null, demi_fin: c.demiFin || null,
      });

      let message = "✅ Congé modifié";

      if (d.statut === "approuve" && sal) {
        const champAvant = d.type==="RTT" ? "soldeRTT" : "solde";
        const champApres = c.type==="RTT" ? "soldeRTT" : "solde";
        const patch = {};

        if (champAvant === champApres) {
          const delta = round2(d.jours - c.jours);   // > 0 → recrédit ; < 0 → débit complémentaire
          if (delta !== 0) {
            patch[champAvant] = round2((sal[champAvant]||0) + delta);
            message = delta > 0
              ? `✅ Congé modifié — ${fmtJours(delta)} j recrédités à ${sal.nom}`
              : `✅ Congé modifié — ${fmtJours(Math.abs(delta))} j supplémentaires débités à ${sal.nom}`;
          }
        } else {
          patch[champAvant] = round2((sal[champAvant]||0) + d.jours);
          patch[champApres] = round2((sal[champApres]||0) - c.jours);
          message = `✅ Congé modifié — ${fmtJours(d.jours)} j recrédités en ${d.type==="RTT"?"RTT":"CP"} et ${fmtJours(c.jours)} j débités en ${c.type==="RTT"?"RTT":"CP"} pour ${sal.nom}`;
        }

        if (Object.keys(patch).length) {
          const dbPatch = {};
          if ("solde" in patch)    dbPatch.solde     = patch.solde;
          if ("soldeRTT" in patch) dbPatch.solde_rtt = patch.soldeRTT;
          await sb.update("employes", sal.id, dbPatch);
          setUsers(p=>p.map(u=>u.id===sal.id?{...u,...patch}:u));
          if (user && user.id===sal.id) setUser(u=>({...u,...patch}));
        }
      }

      setDemandes(p=>p.map(x=>x.id===id?{...x,debut:c.debut,fin:c.fin,jours:c.jours,type:c.type,motif:c.motif||"",demiDebut:c.demiDebut||null,demiFin:c.demiFin||null}:x));
      toast$(message);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Absences ──
  const handleAddAbsence = async (a) => {
    try {
      const [r] = await sb.insert("absences", {
        salarie_id: a.salarieId, salarie_nom: a.salarie,
        type: a.type, debut: a.debut, fin: a.fin, jours: a.jours,
        commentaire: a.commentaire||"", mois: a.mois, annee: a.annee,
        demi_debut: a.demiDebut || null, demi_fin: a.demiFin || null,
      });
      setAbsences(p=>[toAbsence(r),...p]);
      toast$("✅ Absence enregistrée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleEditAbsence = async (id, a) => {
    try {
      await sb.update("absences", id, {
        salarie_id: a.salarieId, salarie_nom: a.salarie,
        type: a.type, debut: a.debut, fin: a.fin, jours: a.jours,
        commentaire: a.commentaire||"", mois: a.mois, annee: a.annee,
        demi_debut: a.demiDebut || null, demi_fin: a.demiFin || null,
      });
      setAbsences(p=>p.map(x=>x.id===id?{...x,...a}:x));
      toast$("✅ Absence modifiée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteAbsence = async (id) => {
    try {
      await sb.delete("absences", id);
      setAbsences(p=>p.filter(a=>a.id!==id));
      toast$("🗑 Absence supprimée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Heures sup ──
  const handleAddHSup = async (h) => {
    try {
      const [r] = await sb.insert("heures_sup", {
        salarie_id: h.salarieId, salarie_nom: h.salarie,
        heures: h.heures, semaine: h.semaine,
        commentaire: h.commentaire||"", mois: h.mois, annee: h.annee,
      });
      setHeuresSup(p=>[toHeureSup(r),...p]);
      toast$("✅ Heures enregistrées");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleEditHSup = async (id, h) => {
    try {
      await sb.update("heures_sup", id, {
        salarie_id: h.salarieId, salarie_nom: h.salarie,
        heures: h.heures, semaine: h.semaine,
        commentaire: h.commentaire||"", mois: h.mois, annee: h.annee,
      });
      setHeuresSup(p=>p.map(x=>x.id===id?{...x,...h}:x));
      toast$("✅ Saisie modifiée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteHSup = async (id) => {
    try {
      await sb.delete("heures_sup", id);
      setHeuresSup(p=>p.filter(h=>h.id!==id));
      toast$("🗑 Supprimé");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Acquisition CP ──
  const handleCreditAcquisition = async (userId, cpAcquis, mois, annee) => {
    try {
      const sal = users.find(u => u.id === userId);
      if (!sal) return;
      // Sécurité : ce mois a-t-il déjà été crédité pour ce salarié ?
      if (acquisitions.some(a => a.salarieId===userId && a.mois===mois && a.annee===annee)) {
        return errToast("Ce mois a déjà été crédité pour ce salarié.");
      }
      const newAcquisition = parseFloat(((sal.soldeAcquisition || 0) + cpAcquis).toFixed(2));
      // 1) Enregistrer la trace du crédit (la contrainte UNIQUE en base empêche tout doublon)
      const [row] = await sb.insert("acquisitions_creditees", {
        salarie_id: userId, mois, annee, montant: cpAcquis,
      });
      // 2) Mettre à jour le solde d'acquisition de l'employé
      await sb.update("employes", userId, { solde_acquisition: newAcquisition });
      setUsers(p => p.map(u => u.id === userId ? { ...u, soldeAcquisition: newAcquisition } : u));
      if (user && user.id === userId) setUser(u => ({ ...u, soldeAcquisition: newAcquisition }));
      setAcquisitions(p => [...p, toAcquisition(row)]);
      toast$(`📈 +${cpAcquis} j crédités en acquisition pour ${sal.nom} (total : ${newAcquisition} j)`);
    } catch(e) {
      const msg = (e.message || "").toLowerCase();
      if (msg.includes("duplicate") || msg.includes("unique"))
        errToast("Ce mois a déjà été crédité pour ce salarié.");
      else errToast("Erreur : " + e.message);
    }
  };

  const handleAnnulerCredit = async (userId, mois, annee) => {
    try {
      const sal = users.find(u => u.id === userId);
      const acq = acquisitions.find(a => a.salarieId===userId && a.mois===mois && a.annee===annee);
      if (!sal || !acq) return;
      const newAcquisition = parseFloat(Math.max(0, (sal.soldeAcquisition || 0) - acq.montant).toFixed(2));
      // 1) Supprimer la trace → réautorise un futur crédit pour ce mois
      await sb.delete("acquisitions_creditees", acq.id);
      // 2) Retirer les jours du solde d'acquisition
      await sb.update("employes", userId, { solde_acquisition: newAcquisition });
      setUsers(p => p.map(u => u.id === userId ? { ...u, soldeAcquisition: newAcquisition } : u));
      if (user && user.id === userId) setUser(u => ({ ...u, soldeAcquisition: newAcquisition }));
      setAcquisitions(p => p.filter(a => a.id !== acq.id));
      toast$(`↩ Crédit annulé pour ${sal.nom} (−${acq.montant} j en acquisition)`);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Employés ──
  const handleAddUser = async (data) => {
    try {
      const [r] = await sb.rpc("create_employee", {
        p_nom: data.nom, p_email: data.email, p_password: data.password,
        p_role: data.role, p_is_admin: data.isAdmin||false,
        p_manager_id: data.managerId||null,
        // num() et non `|| 25` : une création à zéro doit rester à zéro
        p_solde: num(data.solde, 0),
        p_solde_rtt: num(data.soldeRTT, 0),
        p_solde_acquisition: num(data.soldeAcquisition, 0),
      });
      // Recharger la liste employés
      const us = await sb.select("employes","order=nom.asc");
      // create_employee ne gère ni le pôle ni le contrat : on les applique après si besoin
      const created = us.find(u => u.email === data.email);
      if (created) {
        const patch = {};
        if (data.pole && data.pole !== created.pole) patch.pole = data.pole;
        if (data.typeContrat && data.typeContrat !== (created.type_contrat||"cdi")) patch.type_contrat = data.typeContrat;
        // La date d'entrée s'applique à tous les contrats, CDI compris
        if ((data.contratDebut||null) !== (created.contrat_debut||null)) patch.contrat_debut = data.contratDebut || null;
        patch.contrat_fin = (data.typeContrat && data.typeContrat !== "cdi") ? (data.contratFin || null) : null;
        // Filet de sécurité : si la fonction SQL a appliqué ses propres valeurs par défaut,
        // on réaligne les compteurs sur ce qui a été saisi (zéro compris).
        const soldeVoulu = num(data.solde, 0), rttVoulu = num(data.soldeRTT, 0), acqVoulu = num(data.soldeAcquisition, 0);
        if (parseFloat(created.solde||0) !== soldeVoulu) patch.solde = soldeVoulu;
        if (parseFloat(created.solde_rtt||0) !== rttVoulu) patch.solde_rtt = rttVoulu;
        if (parseFloat(created.solde_acquisition||0) !== acqVoulu) patch.solde_acquisition = acqVoulu;
        if (Object.keys(patch).length) {
          await sb.update("employes", created.id, patch);
          Object.assign(created, patch);
        }
      }
      setUsers(us.map(toUser));
      toast$(`✅ Compte créé pour ${data.nom}`);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteUser = async (id) => {
    try {
      await sb.delete("employes", id);
      setUsers(p=>p.filter(u=>u.id!==id));
      toast$("🗑 Employé supprimé");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleUpdateUser = async (id, c) => {
    try {
      const payload = {};
      if (c.nom !== undefined) payload.nom = c.nom;
      if (c.email !== undefined) payload.email = c.email;
      if (c.role !== undefined) payload.role = c.role;
      if (c.pole !== undefined) payload.pole = c.pole;
      if (c.typeContrat !== undefined) payload.type_contrat = c.typeContrat;
      if (c.contratDebut !== undefined) payload.contrat_debut = c.contratDebut;
      if (c.contratFin !== undefined) payload.contrat_fin = c.contratFin;
      if (c.isAdmin !== undefined) payload.is_admin = c.isAdmin;
      if (c.managerId !== undefined) payload.manager_id = c.managerId;
      if (c.solde !== undefined) payload.solde = parseFloat(c.solde);
      if (c.soldeRTT !== undefined) payload.solde_rtt = parseFloat(c.soldeRTT);
      if (c.soldeAcquisition !== undefined) payload.solde_acquisition = parseFloat(c.soldeAcquisition);
      if (c.password) {
        await sb.rpc("change_password", { p_user_id: id, p_new_password: c.password });
      }
      if (Object.keys(payload).length > 0) await sb.update("employes", id, payload);
      const us = await sb.select("employes","order=nom.asc");
      const updated = us.map(toUser);
      setUsers(updated);
      if (user && user.id===id) setUser(updated.find(u=>u.id===id));
      toast$("✅ Employé mis à jour");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Fériés ──
  const handleAddFerie = async (date, label) => {
    try {
      await sb.insert("feries_manuels", { date, label });
      setFeriesManuels(f=>({...f,[date]:label}));
      toast$(`✅ Jour spécial ajouté : ${label}`);
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteFerie = async (date) => {
    try {
      const r = await sb.select("feries_manuels", `date=eq.${date}`);
      if (r[0]) await sb.delete("feries_manuels", r[0].id);
      setFeriesManuels(f=>{ const n={...f}; delete n[date]; return n; });
      toast$("🗑 Jour spécial supprimé");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleOverrideFerie = async (origDate, newDate) => {
    try {
      const existing = await sb.select("feries_overrides", `orig_date=eq.${origDate}`);
      if (existing[0]) await sb.update("feries_overrides", existing[0].id, { new_date: newDate });
      else await sb.insert("feries_overrides", { orig_date: origDate, new_date: newDate });
      setFeriesOverrides(ov=>({...ov,[origDate]:{newDate}}));
      toast$("✅ Date corrigée");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleDeleteOverride = async (origDate) => {
    try {
      const r = await sb.select("feries_overrides", `orig_date=eq.${origDate}`);
      if (r[0]) await sb.delete("feries_overrides", r[0].id);
      setFeriesOverrides(ov=>{ const n={...ov}; delete n[origDate]; return n; });
      toast$("↩ Date rétablie");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleSupprimerFerie = async (date) => {
    try {
      await sb.insert("feries_supprimes", { date });
      setFeriesSupprimés(p => [...p, date]);
      toast$("🗑 Férié supprimé du calendrier");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  const handleRestaurerFerie = async (date) => {
    try {
      const r = await sb.select("feries_supprimes", `date=eq.${date}`);
      if (r[0]) await sb.delete("feries_supprimes", r[0].id);
      setFeriesSupprimés(p => p.filter(d => d !== date));
      toast$("✅ Férié restauré");
    } catch(e) { errToast("Erreur : " + e.message); }
  };

  // ── Render ──
  const pages = user ? {
    dashboard:  <Dashboard user={user} demandes={demandes} />,
    demande:    <NouvelleDemande user={user} onSubmit={handleNouvelleDemande} feriesAll={feriesAll} />,
    historique: <Historique user={user} demandes={demandes} onEdit={handleEditDemande} onDelete={handleDeleteDemande} feriesAll={feriesAll} />,
    planning:   <Planning users={users} demandes={demandes} absences={absences} feriesAll={feriesAll} />,
    validation: <Validation demandes={demandes} users={users} onValider={handleValider} onRefuser={handleRefuser} onAnnuler={handleAnnuler} onSaisirPourSalarie={handleSaisirPourSalarie} onEditAdmin={handleEditDemandeAdmin} feriesAll={feriesAll} managerUser={user} />,
    absences:   <SaisieAbsences absences={absences} users={users} onAdd={handleAddAbsence} onEdit={handleEditAbsence} onDelete={handleDeleteAbsence} currentUser={user} />,
    heures_sup: <HeuresSup heuresSup={heuresSup} users={users} onAdd={handleAddHSup} onEdit={handleEditHSup} onDelete={handleDeleteHSup} currentUser={user} />,
    paie:       <PreparationPaie demandes={demandes} absences={absences} heuresSup={heuresSup} users={users} feriesAll={feriesAll} acquisitions={acquisitions} onCreditAcquisition={handleCreditAcquisition} onAnnulerCredit={handleAnnulerCredit} />,
    equipe:     <Equipe users={users} demandes={demandes} absences={absences} />,
    employes:   <GestionEmployes users={users} onAdd={handleAddUser} onDelete={handleDeleteUser} onUpdate={handleUpdateUser} />,
    feries:     <JoursFeries feriesManuels={feriesManuels} feriesOverrides={feriesOverrides} feriesSupprimés={feriesSupprimés}
                  onAdd={handleAddFerie} onDelete={handleDeleteFerie}
                  onOverride={handleOverrideFerie} onDeleteOverride={handleDeleteOverride}
                  onSupprimerFerie={handleSupprimerFerie} onRestaurerFerie={handleRestaurerFerie} />,
  } : {};

  if (dbError) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f7f4ef",fontFamily:"sans-serif"}}>
      <div style={{background:"#fff",padding:40,borderRadius:12,boxShadow:"0 4px 24px rgba(0,0,0,.1)",maxWidth:480,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:16}}>⚠️</div>
        <h2 style={{marginBottom:8,color:"#1a1a2e"}}>Connexion à la base de données impossible</h2>
        <p style={{color:"#8a8070",marginBottom:20,lineHeight:1.6}}>{dbError}</p>
        <p style={{fontSize:12,color:"#c84b31"}}>Vérifiez que SUPABASE_URL et SUPABASE_ANON_KEY sont corrects dans le fichier index.html</p>
      </div>
    </div>
  );

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f7f4ef",fontFamily:"sans-serif"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:16}}>🌴</div>
        <p style={{color:"#8a8070",fontSize:16}}>Chargement des données…</p>
      </div>
    </div>
  );

  // LoginScreen modifié pour passer email+pwd plutôt que l'objet user
  if (!user) return (
    <>
      <style>{css}</style>
      <LoginScreenSupabase onLogin={handleLogin} />
    </>
  );
  if (user.mustChangePassword) return <><style>{css}</style><ChangePasswordScreen onDone={handleChangePwd} /></>;

  return <>
    <style>{css}</style>
    <Shell user={user} page={page} setPage={setPage} onLogout={()=>setUser(null)}>
      {pages[page]||pages.dashboard}
    </Shell>
    {toast&&<div className={`toast ${toast.type==="err"?"toast-err":""}`}>{toast.msg}</div>}
  </>;
}

// ─── Login Supabase (email + password sans objet user) ────────────────────────
function LoginScreenSupabase({ onLogin }) {
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    if (!email||!pwd) return setErr("Email et mot de passe requis.");
    setLoading(true); setErr("");
    const error = await onLogin(email.trim().toLowerCase(), pwd);
    if (error) setErr(error);
    setLoading(false);
  };

  return (
    <div className="login-wrap">
      <div className="login-brand">
        <div className="login-brand-icon">🌴</div>
        <h1>Gestion des congés Beelog</h1>
        <p>Gestion des congés et absences</p>
      </div>
      <div className="login-form-side">
        <div className="login-card">
          <h2>Connexion</h2>
          <p>Accédez à votre espace</p>
          <div className="field"><label>Email</label>
            <input type="email" value={email} placeholder="vous@beelog.fr" onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
          <div className="field"><label>Mot de passe</label>
            <input type="password" value={pwd} placeholder="••••••••" onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
          {err&&<div className="error-msg">⚠ {err}</div>}
          <button className="btn btn-primary btn-full" onClick={submit} disabled={loading}>
            {loading ? "Connexion…" : "Se connecter →"}
          </button>
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

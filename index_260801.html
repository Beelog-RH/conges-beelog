// ─── Jours fériés France (calcul automatique) ─────────────────────────────────
// fmt local : évite le décalage UTC de toISOString()
function fmtLocal(year, month, day) {
  return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

function getPaques(year) {
  // Algorithme de Meeus/Jones/Butcher — retourne {month (1-based), day}
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31); // 1-based
  const day   = ((h + l - 7 * m + 114) % 31) + 1;
  return { year, month, day }; // month est 1-based
}

// Ajoute n jours à une date {year,month,day} et retourne une string YYYY-MM-DD
function addDays({ year, month, day }, n) {
  const d = new Date(year, month - 1, day + n); // month-1 car Date() attend 0-based
  return fmtLocal(d.getFullYear(), d.getMonth() + 1, d.getDate());
}

function getFeriesAuto(year) {
  const paques = getPaques(year);
  return {
    [fmtLocal(year,  1,  1)]:      "Jour de l'An",
    [addDays(paques, 1)]:          "Lundi de Pâques",
    [fmtLocal(year,  5,  1)]:      "Fête du Travail",
    [fmtLocal(year,  5,  8)]:      "Victoire 1945",
    [addDays(paques, 39)]:         "Ascension",
    [addDays(paques, 50)]:         "Lundi de Pentecôte",
    [fmtLocal(year,  7, 14)]:      "Fête Nationale",
    [fmtLocal(year,  8, 15)]:      "Assomption",
    [fmtLocal(year, 11,  1)]:      "Toussaint",
    [fmtLocal(year, 11, 11)]:      "Armistice",
    [fmtLocal(year, 12, 25)]:      "Noël",
  };
}

// Vérifie les dates calculées pour une année (pour affichage de débogage)
function verifyFeries(year) {
  const f = getFeriesAuto(year);
  return Object.entries(f).sort((a,b)=>a[0].localeCompare(b[0]));
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function joursOuvres(debut, fin, feriesMap = {}) {
  let c = 0; const d = new Date(debut), f = new Date(fin);
  while (d <= f) {
    const day = d.getDay(); const ds = fmtLocal(d.getFullYear(), d.getMonth()+1, d.getDate());
    if (day !== 0 && day !== 6 && !feriesMap[ds]) c++;
    d.setDate(d.getDate() + 1);
  }
  return c;
}

// Un jour donné (YYYY-MM-DD) est-il un jour ouvré ? (hors WE et hors fériés fournis)
function estJourOuvre(ds, feriesMap = {}) {
  const day = new Date(ds).getDay();
  return day !== 0 && day !== 6 && !feriesMap[ds];
}

// Décompte avec demi-journées : retire 0,5 par demi-journée posée sur un jour ouvré
function joursDecomptes(debut, fin, demiDebut, demiFin, feriesMap = {}) {
  let total = joursOuvres(debut, fin, feriesMap);
  if (total <= 0) return 0;
  if (demiDebut && estJourOuvre(debut, feriesMap)) total -= 0.5;
  if (debut !== fin && demiFin && estJourOuvre(fin, feriesMap)) total -= 0.5;
  return total;
}

// Pour le planning : quelle demi-journée (matin / apres_midi) s'applique à ce jour ?
function demiPourJour(rec, ds) {
  if (ds === rec.debut && rec.demiDebut) return rec.demiDebut;
  if (ds === rec.fin && rec.demiFin) return rec.demiFin;
  return null;
}

// Affichage des durées en français : 1 -> "1", 0.5 -> "0,5", 1.5 -> "1,5"
function fmtJours(n) {
  n = Number(n) || 0;
  return (n % 1 === 0) ? String(n) : n.toString().replace(".", ",");
}

// ─── Contrat, présence et recherche ───────────────────────────────────────────
// Date du jour au format YYYY-MM-DD (heure locale)
const todayStr = () => { const d = new Date(); return fmtLocal(d.getFullYear(), d.getMonth()+1, d.getDate()); };

// Affichage d'une date ISO en JJ/MM/AAAA
const fmtFR = ds => ds ? String(ds).split("-").reverse().join("/") : "";

// Arrondi monétaire/jours à 2 décimales
const round2 = v => parseFloat((Number(v)||0).toFixed(2));

// Repli numérique strict : 0 est une valeur valide (contrairement à `|| defaut`)
const num = (v, def=0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : def; };

// Bornes de contrat d'un salarié.
// contratDebut = date d'entrée (tous contrats) · contratFin = fin de contrat (CDD / intérim uniquement)
function bornesContrat(u) {
  if (!u) return { debut: null, fin: null };
  const cdi = (u.typeContrat || "cdi") === "cdi";
  return { debut: u.contratDebut || null, fin: cdi ? null : (u.contratFin || null) };
}

// Présent dans l'entreprise : contrat en cours à la date de référence (aujourd'hui par défaut)
function estPresent(u, ref) {
  const r = ref || todayStr();
  const { debut, fin } = bornesContrat(u);
  if (debut && r < debut) return false;
  if (fin && r > fin) return false;
  return true;
}

// Normalisation pour la recherche : minuscules, sans accents
const norm = s => (s == null ? "" : String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

// Contrôle d'une période de saisie vis-à-vis du contrat du salarié.
// Retourne null si la période est valide, sinon un message explicite.
function verifPeriodeContrat(u, debut, fin) {
  if (!u || !debut || !fin) return null;
  const { debut: cd, fin: cf } = bornesContrat(u);
  if (cd && debut < cd) return `⚠ Période hors contrat : ${u.nom} entre dans l'entreprise le ${fmtFR(cd)}.`;
  if (cf && fin > cf)   return `⚠ Période hors contrat : le contrat de ${u.nom} se termine le ${fmtFR(cf)}.`;
  return null;
}

// ── Contrôle réutilisable : cases demi-journée (début / fin) ──
function DemiJour({ debut, fin, demiDebut, demiFin, onChange }) {
  if (!debut || !fin) return null;
  const single = debut === fin;
  const renderToggle = (val, label, setter) => (
    <div className="form-group">
      <label style={{fontSize:12}}>{label}</label>
      <label className="demi-check">
        <input type="checkbox" checked={!!val} onChange={e=>setter(e.target.checked?"matin":null)} />
        Demi-journée
      </label>
      {val && (
        <div className="demi-seg">
          <button type="button" className={val==="matin"?"active":""} onClick={()=>setter("matin")}>Matin</button>
          <button type="button" className={val==="apres_midi"?"active":""} onClick={()=>setter("apres_midi")}>Après-midi</button>
        </div>
      )}
    </div>
  );
  if (single) return renderToggle(demiDebut, "Demi-journée (ce jour)", v=>onChange(v, null));
  return <>
    {renderToggle(demiDebut, "Premier jour", v=>onChange(v, demiFin))}
    {renderToggle(demiFin,   "Dernier jour", v=>onChange(demiDebut, v))}
  </>;
}

// ── Sélecteur de salarié : liste filtrable par nom + case "présents uniquement" ──
function SelectSalarie({
  users, value, onChange,
  placeholder = "— Choisir un salarié —",
  allowAll = false, allLabel = "Tous les salariés",
  renderLabel, compact = false, disabled = false,
}) {
  const [presentsOnly, setPresentsOnly] = useState(true);
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    const onDoc = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) { setOpen(false); setQuery(""); } };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const base = presentsOnly ? users.filter(u => estPresent(u)) : users;
  const q = norm(query);
  const liste = q ? base.filter(u => norm(u.nom).includes(q)) : base;
  const selected = users.find(u => String(u.id) === String(value));

  const choose = v => { onChange(v); setQuery(""); setOpen(false); };
  const label = selected
    ? (renderLabel ? renderLabel(selected) : selected.nom)
    : (allowAll ? allLabel : placeholder);

  return <div className={`sel-sal ${compact ? "sel-sal-compact" : ""}`} ref={wrapRef}>
    <div className="sel-sal-row">
      <div className="sel-sal-control" onClick={() => !disabled && setOpen(o => !o)}>
        <span className={selected ? "" : "sel-sal-ph"}>{label}</span>
        <span className="sel-sal-caret">▾</span>
      </div>
      <label className="sel-sal-check" title="N'afficher que les salariés dont le contrat est en cours aujourd'hui">
        <input type="checkbox" checked={presentsOnly} onChange={e => setPresentsOnly(e.target.checked)} />
        Présents
      </label>
    </div>
    {open && <div className="sel-sal-pop">
      <input className="sel-sal-search" autoFocus placeholder="Rechercher un nom…"
        value={query} onChange={e => setQuery(e.target.value)} />
      <div className="sel-sal-list">
        {allowAll && !q && <div className="sel-sal-opt" onClick={() => choose("")}>{allLabel}</div>}
        {liste.length === 0
          ? <div className="sel-sal-empty">Aucun salarié{presentsOnly ? " présent" : ""} ne correspond.</div>
          : liste.map(u => (
            <div key={u.id} className={`sel-sal-opt ${String(u.id) === String(value) ? "sel" : ""}`}
              onClick={() => choose(String(u.id))}>
              {renderLabel ? renderLabel(u) : u.nom}
            </div>
          ))}
      </div>
    </div>}
  </div>;
}

// ── Infobulle de détail : survol au bureau, clic sur mobile ──
// Positionnement en `fixed` calculé sur l'élément déclencheur : l'infobulle échappe
// ainsi au recadrage (overflow:hidden) des fiches et des tableaux qui la contiennent.
function InfoTip({ children, items, titre }) {
  const [pos, setPos] = useState(null);
  const ref = useRef(null);

  const montrer = () => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    const dessous = r.top < 170; // pas la place au-dessus → on bascule en dessous
    setPos({ x: r.left + r.width/2, y: dessous ? r.bottom : r.top, dessous });
  };
  const cacher = () => setPos(null);

  if (!items || items.length === 0) return children;

  return <span className="tip-wrap" ref={ref}
    onMouseEnter={montrer} onMouseLeave={cacher}
    onClick={e => { e.stopPropagation(); pos ? cacher() : montrer(); }}>
    {children}
    {pos && <span className={`tip-pop ${pos.dessous ? "tip-below" : ""}`} style={{left:pos.x, top:pos.y}}>
      {titre && <span className="tip-title">{titre}</span>}
      {items.map((it, i) => <span className="tip-row" key={i}>
        <span className="tip-lbl">{it.label}</span>
        <span className="tip-dates">{it.dates}</span>
        <span className="tip-val">{it.val}</span>
      </span>)}
    </span>}
  </span>;
}

function dateInRange(dateStr, debut, fin) {
  return dateStr >= debut && dateStr <= fin;
}

function getDaysInMonth(year, month) {
  const days = [];
  const d = new Date(year, month, 1);
  while (d.getMonth() === month) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return days;
}

function exportCSV(data, filename) {
  const csv = data.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

// ─── Change Password ──────────────────────────────────────────────────────────
function ChangePasswordScreen({ onDone }) {
  const [form, setForm] = useState({ pwd:"", pwd2:"" });
  const [err, setErr] = useState("");
  const submit = () => {
    if (form.pwd.length < 6) return setErr("Au moins 6 caractères requis.");
    if (form.pwd !== form.pwd2) return setErr("Les mots de passe ne correspondent pas.");
    onDone(form.pwd);
  };
  return (
    <div className="changepwd-wrap">
      <div className="changepwd-card">
        <div style={{fontSize:34,marginBottom:10}}>🔐</div>
        <h2>Changement de mot de passe requis</h2>
        <p>Votre compte a été créé avec un mot de passe temporaire. Définissez un mot de passe personnel pour continuer.</p>
        {err && <div className="info-box info-warn" style={{marginBottom:12}}>{err}</div>}
        <div className="field"><label>Nouveau mot de passe</label>
          <input type="password" placeholder="Au moins 6 caractères" value={form.pwd} onChange={e=>setForm({...form,pwd:e.target.value})} /></div>
        <div className="field"><label>Confirmer</label>
          <input type="password" placeholder="Répétez" value={form.pwd2} onChange={e=>setForm({...form,pwd2:e.target.value})} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
        <button className="btn btn-primary btn-full" onClick={submit}>Valider et accéder →</button>
      </div>
    </div>
  );
}

          <div className="field"><label>Email</label>
            <input type="email" value={email} placeholder="vous@entreprise.fr" onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
          <div className="field"><label>Mot de passe</label>
            <input type="password" value={pwd} placeholder="••••••••" onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
          {err && <div className="error-msg">⚠ {err}</div>}
          <button className="btn btn-primary btn-full" onClick={submit}>Se connecter →</button>
        </div>
      </div>
    </div>
  );
}

// ─── Planning Mensuel ─────────────────────────────────────────────────────────
function Planning({ users, demandes, absences, feriesAll }) {
  const now = new Date();
  const [mois, setMois] = useState(now.getMonth());
  const [annee, setAnnee] = useState(now.getFullYear());

  const [vue, setVue] = useState(1); // 1 = un mois, 2 = deux mois côte à côte

  // Mois suivant (pour la vue 2 mois)
  const m2 = (mois + 1) % 12;
  const y2 = mois === 11 ? annee + 1 : annee;

  // Mois actuellement affichés (1 ou 2)
  const moisAffiches = vue === 2 ? [{ m: mois, y: annee }, { m: m2, y: y2 }] : [{ m: mois, y: annee }];

  // Le salarié est-il présent (sous contrat) au moins un jour de ce mois ?
  // Les bornes viennent de bornesContrat() : la date d'entrée s'applique à tous
  // les contrats, CDI compris ; seuls les CDD et intérimaires ont une date de fin.
  const estPresentDansMois = (u, y, m) => {
    const { debut, fin } = bornesContrat(u);
    const monthStart = fmtLocal(y, m + 1, 1);
    const monthEnd   = fmtLocal(y, m + 1, new Date(y, m + 1, 0).getDate());
    if (debut && debut > monthEnd)   return false;
    if (fin   && fin   < monthStart) return false;
    return true;
  };
  // Cette date tombe-t-elle hors de la période de contrat ?
  const estHorsContrat = (u, dateStr) => {
    const { debut, fin } = bornesContrat(u);
    if (debut && dateStr < debut) return true;
    if (fin   && dateStr > fin)   return true;
    return false;
  };
  // Présent sur AU MOINS un des mois affichés (union → lignes identiques sur les 2 mois)
  const presentDansPeriode = (u) => moisAffiches.some(({ m, y }) => estPresentDansMois(u, y, m));

  // Tout le monde, regroupé par pôle (Production → Support → Encadrement),
  // en ne gardant que les personnes présentes sur la période affichée
  const groupes = POLES
    .map(p => ({ ...p, membres: users
      .filter(u => (u.pole || "production") === p.id && presentDansPeriode(u))
      .sort((a,b)=>a.nom.localeCompare(b.nom)) }))
    .filter(g => g.membres.length > 0);

  const prevMonth = () => { if (mois===0){setMois(11);setAnnee(a=>a-1);}else setMois(m=>m-1); };
  const nextMonth = () => { if (mois===11){setMois(0);setAnnee(a=>a+1);}else setMois(m=>m+1); };

  // Calcule le type de journée pour un salarié/date
  // Retourne { type, statut } — statut peut être "approuve" ou "en_attente"
  const getDayInfo = (uid, dateStr) => {
    // Congé approuvé
    const congeOk = demandes.find(d=>d.salarieId===uid&&d.statut==="approuve"&&dateStr>=d.debut&&dateStr<=d.fin);
    if (congeOk) return { type: congeOk.type==="RTT" ? "rtt" : "conge", statut: "approuve", demi: demiPourJour(congeOk, dateStr) };
    // Congé en attente (projeté)
    const congeWait = demandes.find(d=>d.salarieId===uid&&d.statut==="en_attente"&&dateStr>=d.debut&&dateStr<=d.fin);
    if (congeWait) return { type: congeWait.type==="RTT" ? "rtt" : "conge", statut: "en_attente", demi: demiPourJour(congeWait, dateStr) };
    // Absence
    const abs = absences.find(a=>a.salarieId===uid&&dateStr>=a.debut&&dateStr<=a.fin);
    if (abs) return { type: abs.type, statut: "approuve", demi: demiPourJour(abs, dateStr) };
    return null;
  };

  const getCellClass = (info, isWeekend, isFerie) => {
    if (isFerie) return "day-ferie";
    if (isWeekend) return "day-weekend";
    if (!info) return "day-travaille";
    if (info.statut==="en_attente") return info.type==="rtt" ? "day-rtt-attente" : "day-conge-attente";
    if (info.type==="conge") return "day-conge";
    if (info.type==="rtt") return "day-rtt";
    return `day-${info.type}`;
  };

  const getCellLabel = (info, isFerie, isWeekend) => {
    if (isFerie) return "F";
    if (isWeekend || !info) return "";
    if (info.statut==="en_attente") return info.type==="rtt" ? "?" : "?";
    if (info.type==="conge") return "CP";
    if (info.type==="rtt") return "RTT";
    const t = ABSENCE_TYPES.find(x=>x.id===info.type);
    return t ? t.label.split(" ")[0].substring(0,3).toUpperCase() : "";
  };

  // Rendu d'UN seul tableau continu couvrant tous les mois affichés
  // (colonne « Salarié » unique à gauche, mois bout à bout)
  const moisData = moisAffiches.map(({ m, y }) => ({ m, y, days: getDaysInMonth(y, m) }));
  const totalDayCols = moisData.reduce((s, md) => s + md.days.length, 0);
  const multi = moisData.length > 1;

  const renderCell = (sal, d, isMonthStart) => {
    const ds = fmtLocal(d.getFullYear(), d.getMonth()+1, d.getDate());
    const isWE = d.getDay()===0||d.getDay()===6;
    const isFerie = !!feriesAll[ds];
    const sep = isMonthStart ? "month-start" : undefined;
    // Hors contrat un jour ouvré → "non disponible" (WE/fériés conservés)
    if (estHorsContrat(sal, ds) && !isWE && !isFerie) {
      return <td key={ds} className={sep} title="Hors période de contrat"><div className="day-cell day-indispo"></div></td>;
    }
    const info = isWE||isFerie ? null : getDayInfo(sal.id, ds);
    const cls = getCellClass(info, isWE, isFerie);
    const lbl = getCellLabel(info, isFerie, isWE);
    const demiTxt = info && info.demi ? (info.demi==="matin" ? " (matin)" : " (après-midi)") : "";
    const titleTxt = isFerie ? feriesAll[ds]
      : info ? ((info.statut==="en_attente" ? "⏳ En attente de validation" : (ABSENCE_TYPES.find(x=>x.id===info.type)?.label || (info.type==="conge"?"Congés payés":"RTT"))) + demiTxt)
      : "";
    if (info && info.demi) {
      const side = info.demi==="matin" ? "fill-am" : "fill-pm";
      return <td key={ds} className={sep} title={titleTxt}>
        <div className="day-cell day-half">
          <div className={`day-half-fill ${side} ${cls}`}></div>
          <span className="day-half-lbl">{lbl}</span>
        </div>
      </td>;
    }
    return <td key={ds} className={sep} title={titleTxt}><div className={`day-cell ${cls}`}>{lbl}</div></td>;
  };

  const renderPlanning = () => (
    <table className="planning-table">
      <thead>
        {multi && (
          <tr>
            <th className="corner-th" rowSpan={2}>Salarié</th>
            {moisData.map((md, i) => (
              <th key={i} className={`month-title-cell${i>0?" month-start":""}`} colSpan={md.days.length}>
                {MONTHS[md.m]} {md.y}
              </th>
            ))}
          </tr>
        )}
        <tr>
          {!multi && <th className="corner-th">Salarié</th>}
          {moisData.map((md, i) => md.days.map((d, di) => {
            const ds = fmtLocal(d.getFullYear(), d.getMonth()+1, d.getDate());
            const isWE = d.getDay()===0||d.getDay()===6;
            const isFerie = !!feriesAll[ds];
            const title = isFerie ? feriesAll[ds] : "";
            const sep = (i>0 && di===0) ? " month-start" : "";
            return <th key={`${i}-${ds}`} className={`day-header${isWE?" weekend":""}${isFerie?" ferie":""}${sep}`} title={title}>
              <div style={{fontSize:9,color:"var(--muted)"}}>{DAYS_SHORT[(d.getDay()+6)%7]}</div>
              <div>{d.getDate()}</div>
            </th>;
          }))}
        </tr>
      </thead>
      <tbody>
        {groupes.map(g=>(
          <React.Fragment key={g.id}>
            <tr className="planning-group-row">
              <td className="group-cell" colSpan={totalDayCols+1}><span className="group-label">{g.label}</span></td>
            </tr>
            {g.membres.map(sal=>(
              <tr key={sal.id}>
                <td className="name-cell">{sal.nom}</td>
                {moisData.map((md, i) => md.days.map((d, di) => renderCell(sal, d, i>0 && di===0)))}
              </tr>
            ))}
          </React.Fragment>
        ))}
      </tbody>
    </table>
  );

  return <>
    <div className="page-header">
      <div><div className="page-title">Planning équipe 📅</div><div className="page-sub">Vue de présence / absence — tous les pôles</div></div>
      <div className="actions-row">
        <div className="vue-toggle">
          <button className={vue===1?"active":""} onClick={()=>setVue(1)}>1 mois</button>
          <button className={vue===2?"active":""} onClick={()=>setVue(2)}>2 mois</button>
        </div>
        <button className="month-nav-btn" onClick={prevMonth}>◀</button>
        <strong style={{fontSize:15,minWidth:vue===2?230:140,textAlign:"center"}}>
          {vue===2 ? `${MONTHS[mois]} ${annee} — ${MONTHS[m2]} ${y2}` : `${MONTHS[mois]} ${annee}`}
        </strong>
        <button className="month-nav-btn" onClick={nextMonth}>▶</button>
      </div>
    </div>
    <div className="page-body">
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div className={`planning-wrap${vue===2?" planning-compact":""}`}>
          {renderPlanning()}
        </div>
      </div>

      <div className="legend">
        <strong style={{fontSize:11,color:"var(--muted)"}}>Légende :</strong>
        {[
          {label:"Congés payés",col:"#10b981"},
          {label:"RTT",col:"#7c3aed"},
          {label:"Jour férié",col:"#fde8d8",border:"#f59e0b"},
          {label:"Weekend",col:"#f0ece4",border:"#d4cfc6"},
          {label:"Non disponible (hors contrat)",col:"#4b5563"},
          ...ABSENCE_TYPES.map(t=>({label:t.label,col:t.planningColor})),
        ].map(l=>(
          <div className="legend-item" key={l.label}>
            <div className="legend-dot" style={{background:l.col,border:l.border?`1px solid ${l.border}`:undefined}}></div>
            {l.label}
          </div>
        ))}
        {/* Entrées spéciales pour les en attente */}
        <div className="legend-item">
          <div className="legend-dot" style={{background:"repeating-linear-gradient(45deg,#10b981,#10b981 3px,#d1fae5 3px,#d1fae5 7px)"}}></div>
          CP en attente
        </div>
        <div className="legend-item">
          <div className="legend-dot" style={{background:"repeating-linear-gradient(45deg,#7c3aed,#7c3aed 3px,#ede9fe 3px,#ede9fe 7px)"}}></div>
          RTT en attente
        </div>
        <div className="legend-item">
          <div className="legend-dot" style={{background:"linear-gradient(to right, #10b981 50%, transparent 50%)",border:"1px solid #d4cfc6"}}></div>
          Demi-journée (gauche = matin, droite = après-midi)
        </div>
      </div>
      <div className="info-box info-yellow" style={{marginTop:12}}>
        ⏳ Les cases <strong>hachurées</strong> indiquent des congés demandés mais <strong>pas encore validés</strong>. Survolez une case pour voir son statut.
      </div>
    </div>
  </>;
}

// ─── Jours Fériés (Admin) ─────────────────────────────────────────────────────
// feriesOverrides : { "2026-04-06": { label:"Lundi de Pâques", newDate:"2026-04-07" } }
// feriesManuels   : { "2026-05-20": "Pont entreprise" }
function JoursFeries({ feriesManuels, feriesOverrides, feriesSupprimés, onAdd, onDelete, onOverride, onDeleteOverride, onSupprimerFerie, onRestaurerFerie }) {
  const [annee, setAnnee] = useState(new Date().getFullYear());
  const [formSpecial, setFormSpecial] = useState({ date:"", label:"" });
  const [editModal, setEditModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null); // { origDate, label }
  const [err, setErr] = useState("");
  const [errEdit, setErrEdit] = useState("");

  const feriesAutoBase = getFeriesAuto(annee);
  const supprimesAnnee = (feriesSupprimés || []).filter(d => d.startsWith(String(annee)));

  const feriesAutoEffectifs = useMemo(() => {
    const result = {};
    Object.entries(feriesAutoBase).forEach(([d, label]) => {
      if (supprimesAnnee.includes(d)) return; // supprimé → ne pas afficher
      const ov = feriesOverrides[d];
      if (ov) {
        result[ov.newDate] = { label, origDate: d, isOverridden: true };
      } else {
        result[d] = { label, origDate: d, isOverridden: false };
      }
    });
    return result;
  }, [feriesAutoBase, feriesOverrides, supprimesAnnee]);

  // Fériés supprimés pour cette année (pour affichage dans un bloc séparé)
  const feriesSupprimesAffichage = Object.entries(feriesAutoBase)
    .filter(([d]) => supprimesAnnee.includes(d));

  const feriesSpeciaux = Object.entries(feriesManuels).filter(([d]) => d.startsWith(String(annee)));

  const submitSpecial = () => {
    if (!formSpecial.date || !formSpecial.label.trim()) return setErr("Date et libellé requis.");
    const conflict = Object.entries(feriesAutoEffectifs).find(([d]) => d === formSpecial.date);
    if (conflict) return setErr(`Cette date est déjà occupée par "${conflict[1].label}".`);
    onAdd(formSpecial.date, formSpecial.label.trim());
    setFormSpecial({ date:"", label:"" });
    setErr("");
  };

  const openEdit = (effectiveDate, info) => {
    setErrEdit("");
    setEditModal({ origDate: info.origDate, effectiveDate, label: info.label, newDate: effectiveDate });
  };

  const submitEdit = () => {
    if (!editModal.newDate) return setErrEdit("Date requise.");
    if (editModal.newDate === editModal.origDate) {
      onDeleteOverride(editModal.origDate);
    } else {
      const conflict = Object.entries(feriesAutoEffectifs).find(([d,v]) => d === editModal.newDate && v.origDate !== editModal.origDate);
      const conflictSpecial = feriesManuels[editModal.newDate];
      if (conflict) return setErrEdit(`Cette date est déjà occupée par "${conflict[1].label}".`);
      if (conflictSpecial) return setErrEdit(`Cette date est déjà un jour spécial ("${conflictSpecial}").`);
      onOverride(editModal.origDate, editModal.newDate);
    }
    setEditModal(null);
  };

  const fmtDate = (ds) => {
    const [y,m,d] = ds.split("-");
    return `${d}/${m}/${y}`;
  };

  return <>
    <div className="page-header"><div>
      <div className="page-title">Gestion des jours fériés 🗓️</div>
      <div className="page-sub">Calendrier officiel France — correction et jours spéciaux</div>
    </div></div>
    <div className="page-body">
      <div className="month-selector" style={{marginBottom:18}}>
        <label style={{fontSize:13,fontWeight:500}}>Année :</label>
        <select value={annee} onChange={e=>setAnnee(parseInt(e.target.value))}>
          {[2025,2026,2027,2028,2029].map(y=><option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,alignItems:"start"}}>

        {/* ── Fériés calculés ── */}
        <div className="card">
          <div className="card-title">🇫🇷 Jours fériés officiels {annee}</div>
          <div className="info-box info-blue" style={{marginBottom:12,fontSize:12}}>
            Calculés automatiquement. ✏️ pour corriger une date, 🗑 pour supprimer un férié non chômé dans votre entreprise.
          </div>
          <div className="table-wrap"><table>
            <thead><tr>
              <th>Date effective</th>
              <th>Férié</th>
              <th>Statut</th>
              <th></th>
            </tr></thead>
            <tbody>{Object.entries(feriesAutoEffectifs).sort((a,b)=>a[0].localeCompare(b[0])).map(([d, info]) => (
              <tr key={info.origDate}>
                <td style={{whiteSpace:"nowrap",fontWeight:600}}>{fmtDate(d)}</td>
                <td>{info.label}</td>
                <td>
                  {info.isOverridden
                    ? <span className="badge" style={{color:"#d97706",background:"#fef3c7"}}>✏️ Corrigé</span>
                    : <span className="badge" style={{color:"var(--accent2)",background:"#d1fae5"}}>✓ Auto</span>
                  }
                  {info.isOverridden && (
                    <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>
                      Calculé : {fmtDate(info.origDate)}
                    </div>
                  )}
                </td>
                <td>
                  <div className="actions-row">
                    <button className="btn btn-orange btn-sm" onClick={()=>openEdit(d, info)} title="Corriger la date">✏️</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel({origDate: info.origDate, label: info.label})} title="Supprimer ce férié">🗑</button>
                    {info.isOverridden && (
                      <button className="btn btn-ghost btn-sm" onClick={()=>onDeleteOverride(info.origDate)} title="Rétablir la date calculée">↩</button>
                    )}
                  </div>
                </td>
              </tr>
            ))}</tbody>
          </table></div>

          {/* Fériés supprimés */}
          {feriesSupprimesAffichage.length > 0 && (
            <div style={{marginTop:14}}>
              <div className="card-title" style={{marginBottom:8}}>🚫 Supprimés pour {annee}</div>
              {feriesSupprimesAffichage.map(([d, label]) => (
                <div key={d} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
                  <div>
                    <span style={{fontWeight:600,fontSize:13}}>{fmtDate(d)}</span>
                    <span style={{fontSize:12,color:"var(--muted)",marginLeft:8}}>{label}</span>
                  </div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>onRestaurerFerie(d)}>↩ Restaurer</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* ── Jours spéciaux manuels ── */}
        <div>
          <div className="card" style={{marginBottom:14}}>
            <div className="card-title">➕ Ajouter un jour spécial</div>
            <div className="info-box info-purple" style={{marginBottom:10,fontSize:12}}>
              Ponts, journées entreprise, jours supplémentaires non officiel…
            </div>
            {err && <div className="info-box info-warn" style={{marginBottom:10}}>{err}</div>}
            <div className="form-grid">
              <div className="form-group"><label>Date</label>
                <input type="date" value={formSpecial.date} onChange={e=>setFormSpecial({...formSpecial,date:e.target.value})} /></div>
              <div className="form-group"><label>Libellé</label>
                <input type="text" value={formSpecial.label} onChange={e=>setFormSpecial({...formSpecial,label:e.target.value})} placeholder="Ex: Pont entreprise" /></div>
            </div>
            <div className="form-actions">
              <button className="btn btn-primary" onClick={submitSpecial} disabled={!formSpecial.date||!formSpecial.label}>Ajouter</button>
            </div>
          </div>

          <div className="card">
            <div className="card-title">📌 Jours spéciaux ({annee}) — {feriesSpeciaux.length} saisi(s)</div>
            {feriesSpeciaux.length===0
              ? <div className="empty-state" style={{padding:"18px"}}><p>Aucun jour spécial pour {annee}.</p></div>
              : <div className="table-wrap"><table>
                  <thead><tr><th>Date</th><th>Libellé</th><th></th></tr></thead>
                  <tbody>{feriesSpeciaux.sort().map(([d,n])=>(
                    <tr key={d}>
                      <td style={{fontWeight:600,whiteSpace:"nowrap"}}>{fmtDate(d)}</td>
                      <td>{n}</td>
                      <td><button className="btn btn-danger btn-sm" onClick={()=>onDelete(d)}>Supprimer</button></td>
                    </tr>
                  ))}</tbody>
                </table></div>
            }
          </div>
        </div>
      </div>
    </div>

    {/* Modal confirmation suppression férié officiel */}
    {confirmDel && (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setConfirmDel(null)}>
        <div className="modal" style={{maxWidth:440}}>
          <div className="modal-header">
            <div className="modal-title">Supprimer un jour férié</div>
            <button className="modal-close" onClick={()=>setConfirmDel(null)}>×</button>
          </div>
          <div className="info-box info-warn" style={{marginBottom:14}}>
            ⚠️ Supprimer <strong>{confirmDel.label}</strong> ({fmtDate(confirmDel.origDate)}) le retirera du calendrier et des calculs de jours ouvrés pour {annee}. Il sera considéré comme un jour travaillé normal.
          </div>
          <p style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>Cette action est réversible — vous pourrez le restaurer à tout moment.</p>
          <div className="form-actions">
            <button className="btn btn-danger" onClick={()=>{ onSupprimerFerie(confirmDel.origDate, annee); setConfirmDel(null); }}>
              🗑 Confirmer la suppression
            </button>
            <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Annuler</button>
          </div>
        </div>
      </div>
    )}

    {/* Modal correction date calculée */}
    {editModal && (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditModal(null)}>
        <div className="modal" style={{maxWidth:460}}>
          <div className="modal-header">
            <div className="modal-title">Corriger la date — {editModal.label}</div>
            <button className="modal-close" onClick={()=>setEditModal(null)}>×</button>
          </div>
          <div className="info-box info-yellow" style={{marginBottom:14}}>
            Date calculée automatiquement : <strong>{fmtDate(editModal.origDate)}</strong><br/>
            Si cette date est incorrecte dans votre contexte, corrigez-la ci-dessous.
          </div>
          {errEdit && <div className="info-box info-warn" style={{marginBottom:10}}>{errEdit}</div>}
          <div className="form-group">
            <label>Date corrigée pour {editModal.label}</label>
            <input type="date" value={editModal.newDate}
              onChange={e=>setEditModal({...editModal,newDate:e.target.value})} />
          </div>
          <div className="info-box info-blue" style={{marginTop:10,fontSize:12}}>
            ℹ Cette correction ne s'applique qu'à l'année {annee}. La date calculée reste visible pour référence.
          </div>
          <div className="form-actions" style={{marginTop:16}}>
            <button className="btn btn-primary" onClick={submitEdit}>Enregistrer la correction</button>
            {editModal.effectiveDate !== editModal.origDate && (
              <button className="btn btn-ghost" onClick={()=>{onDeleteOverride(editModal.origDate);setEditModal(null);}}>
                ↩ Rétablir la date calculée
              </button>
            )}
            <button className="btn btn-ghost" onClick={()=>setEditModal(null)}>Annuler</button>
          </div>
        </div>
      </div>
    )}
  </>;
}

// ─── Nouvelle Demande ─────────────────────────────────────────────────────────
function NouvelleDemande({ user, onSubmit, feriesAll }) {
  const [form, setForm] = useState({debut:"",fin:"",type:"Congés payés",motif:"",demiDebut:null,demiFin:null});
  const [done, setDone] = useState(false);
  const jours = form.debut&&form.fin ? joursDecomptes(form.debut,form.fin,form.demiDebut,form.demiFin,feriesAll) : 0;
  const solde = form.type==="RTT" ? user.soldeRTT : user.solde;
  const soldeApres = solde-jours;
  const bornes = bornesContrat(user);
  const errContrat = verifPeriodeContrat(user, form.debut, form.fin);
  const submit = () => { if (!form.debut||!form.fin||jours<=0||errContrat) return; onSubmit({...form,jours,salarie:user.nom,salarieId:user.id}); setDone(true); };
  if (done) return <>
    <div className="page-header"><div className="page-title">Nouvelle demande</div></div>
    <div className="page-body"><div className="card" style={{textAlign:"center",padding:"40px"}}>
      <div style={{fontSize:40,marginBottom:11}}>✅</div>
      <h2 style={{fontFamily:"'DM Serif Display',serif",marginBottom:7}}>Demande envoyée !</h2>
      <p style={{color:"var(--muted)",marginBottom:20}}>Votre manager sera notifié prochainement.</p>
      <button className="btn btn-ghost" onClick={()=>{setDone(false);setForm({debut:"",fin:"",type:"Congés payés",motif:"",demiDebut:null,demiFin:null});}}>Faire une autre demande</button>
    </div></div>
  </>;
  return <>
    <div className="page-header"><div><div className="page-title">Nouvelle demande</div><div className="page-sub">Soumettez une demande de congé</div></div></div>
    <div className="page-body"><div className="card">
      <div className="form-grid">
        <div className="form-group"><label>Début</label><input type="date" value={form.debut} min={bornes.debut||undefined} max={bornes.fin||undefined} onChange={e=>setForm({...form,debut:e.target.value})} /></div>
        <div className="form-group"><label>Fin</label><input type="date" value={form.fin} min={form.debut||bornes.debut||undefined} max={bornes.fin||undefined} onChange={e=>setForm({...form,fin:e.target.value})} /></div>
        <DemiJour debut={form.debut} fin={form.fin} demiDebut={form.demiDebut} demiFin={form.demiFin} onChange={(dd,df)=>setForm({...form,demiDebut:dd,demiFin:df})} />
        <div className="form-group"><label>Type</label>
          <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
            <option>Congés payés</option><option>RTT</option><option>Congé sans solde</option><option>Congé exceptionnel</option>
          </select></div>
        <div className="form-group"><label>Durée (jours ouvrés hors fériés)</label><input readOnly value={jours>0?`${fmtJours(jours)} jour(s)`:"—"} /></div>
        <div className="form-group full"><label>Motif</label><textarea value={form.motif} onChange={e=>setForm({...form,motif:e.target.value})} placeholder="Optionnel…" /></div>
      </div>
      {(bornes.debut||bornes.fin)&&<div className="info-box info-blue" style={{marginTop:12}}>
        ℹ Période de saisie autorisée : {bornes.debut?`à partir du ${fmtFR(bornes.debut)}`:"sans limite de début"}{bornes.fin?` et jusqu'au ${fmtFR(bornes.fin)}`:""}.
      </div>}
      {errContrat&&<div className="info-box info-warn" style={{marginTop:12}}>{errContrat}</div>}
      {jours>0&&!errContrat&&<div className={`info-box ${soldeApres>=0?"info-ok":"info-yellow"}`} style={{marginTop:12}}>
        {soldeApres>=0
          ? `✅ Solde après demande : ${fmtJours(soldeApres)} j`
          : `⚠ Solde insuffisant de ${fmtJours(Math.abs(soldeApres))} j — votre manager pourra accepter ou refuser cette demande en anticipation de la prochaine période.`}
      </div>}
      <div className="form-actions"><button className="btn btn-primary" onClick={submit} disabled={jours<=0||!!errContrat}>Envoyer →</button></div>
    </div></div>
  </>;
}

// ─── Historique ───────────────────────────────────────────────────────────────
function Historique({ user, demandes, onEdit, onDelete, feriesAll }) {
  const mes = [...demandes.filter(d=>d.salarieId===user.id)].sort((a,b)=>new Date(b.date_demande)-new Date(a.date_demande));
  const [editModal, setEditModal] = useState(null);
  const [form, setForm] = useState({});
  const jours = form.debut&&form.fin ? joursDecomptes(form.debut,form.fin,form.demiDebut,form.demiFin,feriesAll) : 0;
  const bornes = bornesContrat(user);
  const errContrat = verifPeriodeContrat(user, form.debut, form.fin);
  return <>
    <div className="page-header"><div><div className="page-title">Mes demandes</div><div className="page-sub">{mes.length} demande(s)</div></div></div>
    <div className="page-body">
      {mes.length===0 ? <div className="empty-state"><div className="empty-icon">📋</div><p>Aucune demande.</p></div> : (
        <div className="table-wrap"><table>
          <thead><tr><th>Type</th><th>Période</th><th>Durée</th><th>Statut</th><th>Actions</th></tr></thead>

              <td><strong>{d.type}</strong></td>
              <td style={{whiteSpace:"nowrap"}}>{d.debut} → {d.fin}</td>
              <td>{fmtJours(d.jours)} j</td>
              <td><span className="badge" style={{color:s.color,background:s.bg}}>{s.label}</span></td>
              <td><div className="actions-row">
                {peutModifier&&<><button className="btn btn-orange btn-sm" onClick={()=>{setForm({debut:d.debut,fin:d.fin,type:d.type,motif:d.motif,demiDebut:d.demiDebut,demiFin:d.demiFin});setEditModal(d);}}>✏ Modifier</button>
                <button className="btn btn-danger btn-sm" onClick={()=>onDelete(d.id)}>✗ Suppr.</button></>}
                {!peutModifier&&<span style={{fontSize:11,color:"var(--muted)"}}>—</span>}
              </div></td>
            </tr>;
          })}</tbody>
        </table></div>
      )}
      <div className="info-box info-blue" style={{marginTop:12}}>ℹ Modification possible uniquement sur les demandes en attente.</div>
    </div>
    {editModal&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditModal(null)}>
      <div className="modal">
        <div className="modal-header"><div className="modal-title">Modifier la demande</div><button className="modal-close" onClick={()=>setEditModal(null)}>×</button></div>
        <div className="form-grid">
          <div className="form-group"><label>Début</label><input type="date" value={form.debut} min={bornes.debut||undefined} max={bornes.fin||undefined} onChange={e=>setForm({...form,debut:e.target.value})} /></div>
          <div className="form-group"><label>Fin</label><input type="date" value={form.fin} min={form.debut||bornes.debut||undefined} max={bornes.fin||undefined} onChange={e=>setForm({...form,fin:e.target.value})} /></div>
          <DemiJour debut={form.debut} fin={form.fin} demiDebut={form.demiDebut} demiFin={form.demiFin} onChange={(dd,df)=>setForm({...form,demiDebut:dd,demiFin:df})} />
          <div className="form-group"><label>Type</label>
            <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
              <option>Congés payés</option><option>RTT</option><option>Congé sans solde</option><option>Congé exceptionnel</option>
            </select></div>
          <div className="form-group"><label>Durée</label><input readOnly value={jours>0?`${fmtJours(jours)} j`:"—"} /></div>
          <div className="form-group full"><label>Motif</label><textarea value={form.motif} onChange={e=>setForm({...form,motif:e.target.value})} /></div>
        </div>
        {errContrat&&<div className="info-box info-warn" style={{marginTop:10}}>{errContrat}</div>}
        <div className="form-actions">
          <button className="btn btn-primary" disabled={jours<=0||!!errContrat} onClick={()=>{onEdit(editModal.id,{...form,jours});setEditModal(null);}}>Enregistrer</button>
          <button className="btn btn-ghost" onClick={()=>setEditModal(null)}>Annuler</button>
        </div>
      </div>
    </div>}
  </>;
}

// ─── Validation ───────────────────────────────────────────────────────────────
function Validation({ demandes, users, onValider, onRefuser, onAnnuler, onSaisirPourSalarie, onEditAdmin, feriesAll, managerUser }) {
  const [filtreSalarie, setFiltreSalarie] = useState("");
  const matchFiltre = d => !filtreSalarie || d.salarieId === parseInt(filtreSalarie);
  const enAttente  = demandes.filter(d=>d.statut==="en_attente"&&matchFiltre(d)).sort((a,b)=>new Date(a.date_demande)-new Date(b.date_demande));
  const approuvees = demandes.filter(d=>d.statut==="approuve"&&matchFiltre(d)).sort((a,b)=>new Date(b.debut)-new Date(a.debut));
  // Liste des salariés ayant au moins une demande (pour le filtre)
  const idsAvecDemande = new Set(demandes.map(d=>d.salarieId));
  const salariesFiltrables = users.filter(u=>idsAvecDemande.has(u.id)).sort((a,b)=>a.nom.localeCompare(b.nom));
  const [tab, setTab] = useState("attente");
  const isAdmin = !!managerUser.isAdmin;

  // Saisie manager : salariés rattachés à ce manager
  const mesSalaries = users.filter(u=>u.role==="salarie"&&u.managerId===managerUser.id);
  const [form, setForm] = useState({salarieId:"",debut:"",fin:"",type:"Congés payés",motif:"",demiDebut:null,demiFin:null});
  const [formErr, setFormErr] = useState("");
  const [done, setDone] = useState(false);

  const salChoisi = mesSalaries.find(u=>u.id===parseInt(form.salarieId));
  const jours = form.debut&&form.fin ? joursDecomptes(form.debut,form.fin,form.demiDebut,form.demiFin,feriesAll) : 0;
  const solde = salChoisi ? (form.type==="RTT" ? salChoisi.soldeRTT : salChoisi.solde) : 0;
  const soldeApres = solde - jours;
  const bornesSaisie = bornesContrat(salChoisi);
  const errContratSaisie = verifPeriodeContrat(salChoisi, form.debut, form.fin);

  // ── Modification administrateur d'un congé existant ──
  const [editModal, setEditModal] = useState(null);
  const [editForm, setEditForm] = useState({});
  const salEdit = editModal ? users.find(u=>u.id===editModal.salarieId) : null;
  const joursEdit = editForm.debut&&editForm.fin ? joursDecomptes(editForm.debut,editForm.fin,editForm.demiDebut,editForm.demiFin,feriesAll) : 0;
  const bornesEdit = bornesContrat(salEdit);
  const errContratEdit = verifPeriodeContrat(salEdit, editForm.debut, editForm.fin);

  const openEdit = d => {
    setEditForm({debut:d.debut,fin:d.fin,type:d.type,motif:d.motif||"",demiDebut:d.demiDebut||null,demiFin:d.demiFin||null});
    setEditModal(d);
  };

  // Impact prévisionnel sur le solde (uniquement pour un congé déjà approuvé)
  const impactEdit = (() => {
    if (!editModal || editModal.statut!=="approuve" || !salEdit || joursEdit<=0) return null;
    const champAvant = editModal.type==="RTT" ? "RTT" : "CP";
    const champApres = editForm.type==="RTT" ? "RTT" : "CP";
    if (champAvant===champApres) {
      const delta = round2(editModal.jours - joursEdit);
      if (delta===0) return null;
      return delta>0
        ? `↩ ${fmtJours(delta)} j seront recrédités sur le solde ${champAvant} de ${salEdit.nom}.`
        : `↓ ${fmtJours(Math.abs(delta))} j supplémentaires seront débités du solde ${champAvant} de ${salEdit.nom}.`;
    }
    return `↔ ${fmtJours(editModal.jours)} j seront recrédités sur le solde ${champAvant} et ${fmtJours(joursEdit)} j débités du solde ${champApres} de ${salEdit.nom}.`;
  })();

  const submitSaisie = () => {
    if (!form.salarieId) return setFormErr("Veuillez choisir un salarié.");
    if (!form.debut||!form.fin||jours<=0) return setFormErr("Dates invalides.");
    if (errContratSaisie) return setFormErr(errContratSaisie);
    if (soldeApres < 0) setFormErr(`⚠ Solde insuffisant de ${fmtJours(Math.abs(soldeApres))} jour(s) — la demande sera créée en anticipation de la prochaine période.`);
    onSaisirPourSalarie({
      salarieId: parseInt(form.salarieId),
      salarie: salChoisi.nom,
      debut: form.debut, fin: form.fin,
      jours, type: form.type, motif: form.motif,
      demiDebut: form.demiDebut, demiFin: form.demiFin,
    });
    setForm({salarieId:"",debut:"",fin:"",type:"Congés payés",motif:"",demiDebut:null,demiFin:null});
    setFormErr(""); setDone(true);
    setTimeout(()=>setDone(false), 3000);
  };

  return <>
    <div className="page-header"><div><div className="page-title">Validation congés</div><div className="page-sub">{enAttente.length} en attente</div></div></div>
    <div className="page-body">
      <div className="tabs">
        <button className={`tab ${tab==="attente"?"active":""}`}   onClick={()=>setTab("attente")}>⏳ En attente ({enAttente.length})</button>
        <button className={`tab ${tab==="approuvees"?"active":""}`} onClick={()=>setTab("approuvees")}>✅ Approuvés ({approuvees.length})</button>
        <button className={`tab ${tab==="saisie"?"active":""}`}     onClick={()=>setTab("saisie")}>✏️ Saisir pour un salarié</button>
      </div>

      {(tab==="attente"||tab==="approuvees")&&(
        <div className="actions-row" style={{marginBottom:14,alignItems:"center",gap:12}}>
          <label style={{fontSize:13,color:"var(--muted)"}}>Filtrer :</label>
          <div style={{minWidth:280,flex:"0 1 380px"}}>
            <SelectSalarie compact allowAll users={salariesFiltrables} value={filtreSalarie} onChange={setFiltreSalarie} />
          </div>
          {filtreSalarie&&<button className="btn btn-ghost btn-sm" onClick={()=>setFiltreSalarie("")}>✕ Réinitialiser</button>}
        </div>
      )}

      {/* ── En attente ── */}
      {tab==="attente"&&(enAttente.length===0
        ? <div className="card"><div className="empty-state"><div className="empty-icon">🎉</div><p>Tout est traité !</p></div></div>
        : <div className="table-wrap"><table>
            <thead><tr><th>Salarié</th><th>Type</th><th>Période</th><th>Durée</th><th>Solde actuel</th><th>Motif</th><th>Actions</th></tr></thead>
            <tbody>{enAttente.map(d=>{
              const sal = users.find(u=>u.id===d.salarieId);
              const soldeActuel = sal ? (d.type==="RTT" ? sal.soldeRTT : sal.solde) : null;
              const soldeApresD = soldeActuel !== null ? soldeActuel - d.jours : null;
              return (
              <tr key={d.id} style={soldeApresD!==null&&soldeApresD<0?{background:"#fff8f0"}:{}}>
                <td><strong>{d.salarie}</strong></td><td>{d.type}</td>
                <td style={{whiteSpace:"nowrap"}}>{d.debut} → {d.fin}</td><td>{fmtJours(d.jours)} j</td>
                <td>
                  {soldeActuel!==null&&<>
                    <span style={{fontWeight:600,color:soldeApresD<0?"#c84b31":"#2d6a4f"}}>{fmtJours(soldeActuel)}j</span>
                    {soldeApresD<0&&<span className="badge" style={{color:"#c84b31",background:"#fee2e2",marginLeft:4,fontSize:10}}>⚠ -{fmtJours(Math.abs(soldeApresD))}j</span>}
                  </>}
                </td>
                <td style={{color:"var(--muted)",fontSize:11}}>{d.motif||"—"}</td>
                <td><div className="actions-row">
                  <button className="btn btn-success btn-sm" onClick={()=>onValider(d.id)}>✓ Approuver</button>
                  <button className="btn btn-danger btn-sm"  onClick={()=>onRefuser(d.id)}>✗ Refuser</button>
                  {isAdmin&&<button className="btn btn-orange btn-sm" onClick={()=>openEdit(d)}>✏ Modifier</button>}
                </div></td>
              </tr>
            )})}</tbody>
          </table></div>
      )}

      {/* ── Approuvés ── */}
      {tab==="approuvees"&&(<>
        <div className="info-box info-yellow" style={{marginBottom:12}}>⚠ Annuler recrédite automatiquement les jours sur le solde du salarié.</div>
        {approuvees.length===0
          ? <div className="empty-state"><div className="empty-icon">📋</div><p>Aucun congé approuvé.</p></div>
          : <div className="table-wrap"><table>
              <thead><tr><th>Salarié</th><th>Type</th><th>Période</th><th>Durée</th><th></th></tr></thead>
              <tbody>{approuvees.map(d=>(
                <tr key={d.id}>
                  <td><strong>{d.salarie}</strong></td><td>{d.type}</td>
                  <td style={{whiteSpace:"nowrap"}}>{d.debut} → {d.fin}</td><td>{fmtJours(d.jours)} j</td>
                  <td><div className="actions-row">
                    <button className="btn btn-orange btn-sm" onClick={()=>onAnnuler(d.id)}>↩ Annuler</button>
